<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Header — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="onboarding-header.css">
  <style>
    body { margin: 0; background: var(--background-page); font-family: var(--font-family-base); }
  </style>
</head>
<body>

  <!-- Onboarding Header — Stage = Quote -->
  <div class="onboarding-header">
    <div class="onboarding-header__steps">
      <div class="onboarding-steps onboarding-steps--numbered">
        <div class="onboarding-steps__step onboarding-steps__step--current">
          <span class="onboarding-steps__badge"><span class="onboarding-steps__badge-num">1</span><span class="onboarding-steps__badge-tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          <span class="onboarding-steps__label">Quote</span>
          <span class="onboarding-steps__track"><span class="onboarding-steps__fill"></span></span>
        </div>
        <div class="onboarding-steps__step">
          <span class="onboarding-steps__badge"><span class="onboarding-steps__badge-num">2</span><span class="onboarding-steps__badge-tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          <span class="onboarding-steps__label">Details</span>
          <span class="onboarding-steps__track"><span class="onboarding-steps__fill"></span></span>
        </div>
        <div class="onboarding-steps__step">
          <span class="onboarding-steps__badge"><span class="onboarding-steps__badge-num">3</span><span class="onboarding-steps__badge-tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          <span class="onboarding-steps__label">Review</span>
          <span class="onboarding-steps__track"><span class="onboarding-steps__fill"></span></span>
        </div>
        <div class="onboarding-steps__step">
          <span class="onboarding-steps__badge"><span class="onboarding-steps__badge-num">4</span><span class="onboarding-steps__badge-tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          <span class="onboarding-steps__label">Payment</span>
          <span class="onboarding-steps__track"><span class="onboarding-steps__fill"></span></span>
        </div>
      </div>
    </div>
    <div class="onboarding-header__body">
      <h2 class="onboarding-header__title">Hi John, thanks for choosing us on</h2>
      <div class="onboarding-header__meta">
        <span class="partner partner--gocompare" role="img" aria-label="GoCompare"></span>
        <span class="plate">SH48 HSA</span>
      </div>
    </div>
  </div>

</body>
</html>
