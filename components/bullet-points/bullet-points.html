  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background-page); color: var(--text-primary); font-family: var(--font-family-base); min-height: 100vh; }
    .header { width: 100%; height: 104px; background: var(--brand-3-high); display: flex; align-items: center; justify-content: center; }
    .header__logo { display: inline-flex; align-items: center; color: var(--colour-white); }
    .header__logo svg { width: 110px; height: 32px; display: block; }
    .content { max-width: 876px; margin: 0 auto; padding: 24px 24px 96px; }
    .back-btn { margin-bottom: 24px; }
    .component-header { margin-bottom: 24px; }
    .component-header__name { font-family: var(--font-family-base); font-weight: var(--font-weight-bold); font-size: var(--font-size-title-4); line-height: var(--line-height-title-4); color: var(--text-primary); margin: 0; }
    .component-header__description { font-family: var(--font-family-base); font-weight: var(--font-weight-regular); font-size: var(--font-size-body-2); line-height: var(--line-height-body-2); color: var(--colour-grey-60); margin: 4px 0 0; }
    .variants { background: var(--colour-white); border-radius: 16px; border: 1px solid var(--border-primary); padding: 24px; display: flex; flex-wrap: wrap; gap: 40px; }
    [data-theme="dark"] .variants { background: var(--surface-primary); }
    .variant-group__label { font-family: var(--font-family-base); font-size: var(--font-size-subtitle-3); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: 0.08em; color: var(--colour-grey-60); margin: 0 0 16px; }
  </style>
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>
</head>
<body>

64557 85.7779 2.66911 93.3844 2.66911C100.991 2.66911 107.171 8.64557 107.171 16.0014ZM101.258 16.0014C101.258 11.8062 97.7225 8.38698 93.3844 8.38698C89.0464 8.38698 85.5104 11.8062 85.5104 16.0014C85.5104 20.1962 89.0464 23.6155 93.3844 23.6155C97.7523 23.6155 101.258 20.1962 101.258 16.0014ZM76.6559 17.8688V14.1336C76.6559 13.5877 76.2102 13.1567 75.6457 13.1567H64.4439C63.8793 13.1567 63.4336 13.5877 63.4336 14.1336V17.8688C63.4336 18.415 63.8793 18.8457 64.4439 18.8457H75.6457C76.2102 18.8457 76.6559 18.415 76.6559 17.8688Z" fill="currentColor"/></svg></span>
  </header>

  <main class="content">

    <a class="btn btn--secondary btn--large btn--pill back-btn" href="../../index.html">
      <span class="btn__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Back
    </a>

    <div class="component-header">
      <h1 class="component-header__name">Bullet Points</h1>
      <p class="component-header__description">Tick bullet list — with optional title, support text &amp; info icons — Zego Design System</p>
    </div>

    <div class="variants">
      <div>
        <p class="variant-group__label">Simple</p>
        <div id="simple"></div>
      </div>
      <div>
        <p class="variant-group__label">With title</p>
        <div id="titled"></div>
      </div>
      <div>
        <p class="variant-group__label">With support text &amp; info</p>
        <div id="rich"></div>
      </div>
    </div>

  </main>

  <script>
    var TICK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1Z" fill="#00E660"/><path fill-rule="evenodd" clip-rule="evenodd" d="M10.4866 13.5576L15.1072 8.9369C15.3025 8.74164 15.6191 8.74164 15.8143 8.9369L16.5214 9.64401C16.7167 9.83927 16.7167 10.1558 16.5214 10.3511L10.8513 16.0213C10.656 16.2166 10.3394 16.2166 10.1442 16.0213L7.60355 13.4807C7.40829 13.2854 7.40829 12.9689 7.60355 12.7736L8.29953 12.0776C8.4948 11.8824 8.81138 11.8824 9.00664 12.0776L10.4866 13.5576Z" fill="currentColor"/></svg>';
    var INFO = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7C11.3096 7 10.75 7.55964 10.75 8.25C10.75 8.94036 11.3096 9.5 12 9.5C12.6904 9.5 13.25 8.94036 13.25 8.25C13.25 7.55964 12.6904 7 12 7Z" fill="currentColor"/><path d="M13 11.5C13 11.2239 12.7761 11 12.5 11H11.5C11.2239 11 11 11.2239 11 11.5L11 16.5C11 16.7761 11.2239 17 11.5 17L12.5 17C12.7761 17 13 16.7761 13 16.5L13 11.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1ZM3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12Z" fill="currentColor"/></svg>';

    function bullet(o) {
      var info = o.info ? '<span class="bullet-point__info">' + INFO + '</span>' : '';
      var support = o.support ? '<span class="bullet-point__support">' + o.support + '</span>' : '';
      return '<div class="bullet-point' + (o.support ? ' bullet-point--support' : '') + '">'
        + '<span class="bullet-point__icon">' + TICK + '</span>'
        + '<span class="bullet-point__main">'
        +   '<span class="bullet-point__row"><span class="bullet-point__text">' + o.text + '</span>' + info + '</span>'
        +   support
        + '</span>'
        + '</div>';
    }
    function list(items, title) {
      return '<div class="bullet-points">'
        + (title ? '<p class="bullet-points__title">' + title + '</p>' : '')
        + items.map(bullet).join('')
        + '</div>';
    }

    document.getElementById('simple').innerHTML = list([
      { text: 'Up to 25% off for good driving' },
      { text: 'Earn up to £60 in rewards' },
      { text: 'Privacy-first — your location stays yours' }
    ]);

    document.getElementById('titled').innerHTML = list([
      { text: 'Comprehensive cover' },
      { text: 'Windscreen repair' },
      { text: 'Courtesy car' }
    ], "What's included");

    document.getElementById('rich').innerHTML = list([
      { text: 'Breakdown cover', support: 'Roadside and recovery in the UK', info: true },
      { text: 'Legal expenses', support: 'Up to £100,000 of cover', info: true },
      { text: 'No claims discount', support: 'Protect your discount' }
    ]);
  </script>

</body>
</html>
