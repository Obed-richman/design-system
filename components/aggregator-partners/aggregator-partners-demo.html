<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="aggregator-partners.css">
  <title>Aggregator Partners Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f4f6; margin: 0; padding: 48px 24px; color: #27252d; }
    .wrap { max-width: 720px; margin: 0 auto; text-align: center; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 24px; }
    h2 { font-size: 18px; font-weight: 700; margin: 0 0 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Aggregator Partners</h1>
    <p class="subtitle">Zego Design System</p>

    <h2>Compare us on</h2>
    <div class="partners">
      <span class="partner partner--ctm" role="img" aria-label="Compare the Market"></span>
      <span class="partner partner--gocompare" role="img" aria-label="GoCompare"></span>
      <span class="partner partner--confused" role="img" aria-label="Confused.com"></span>
      <span class="partner partner--quotezone" role="img" aria-label="Quotezone"></span>
      <span class="partner partner--msm" role="img" aria-label="MoneySuperMarket"></span>
      <span class="partner partner--insuremy" role="img" aria-label="InsureMy4Less"></span>
      <span class="partner partner--drivescore" role="img" aria-label="DriveScore"></span>
    </div>
  </div>
</body>
</html>
