<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="tooltip.css">
  <style>
    body { margin: 0; padding: 48px; background: var(--background-page); font-family: var(--font-family-base); display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
  </style>
</head>
<body>

  <div class="tooltip tooltip--down"><p class="tooltip__text">Drive well and keep your discount for next year.</p></div>

  <div class="tooltip tooltip--up"><p class="tooltip__text">Drive well and keep your discount for next year.</p></div>

  <div class="tooltip tooltip--left"><p class="tooltip__text">This is where your policy number lives.</p></div>

  <div class="tooltip tooltip--right"><p class="tooltip__text">This is where your policy number lives.</p></div>

</body>
</html>
