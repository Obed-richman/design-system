<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="status-label.css">
  <title>Status Label Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
    section { margin-bottom: 40px; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .label { font-size: 11px; color: #A0A0A0; width: 72px; flex-shrink: 0; }
    .dark-demo { background: var(--brand-3-high); border-radius: 12px; padding: 24px; }
    .dark-demo h2 { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <h1>Status Label</h1>
  <p class="subtitle">State × Style — Zego Design System</p>

  <section>
    <h2>Pill</h2>
    <div class="row">
      <span class="status-label status-label--information">Information</span>
      <span class="status-label status-label--success">Success</span>
      <span class="status-label status-label--warning">Warning</span>
      <span class="status-label status-label--error">Error</span>
      <span class="status-label status-label--inactive">Inactive</span>
      <span class="status-label status-label--disabled">Disabled</span>
    </div>
  </section>

  <section>
    <h2>Rounded</h2>
    <div class="row">
      <span class="status-label status-label--rounded status-label--information">Information</span>
      <span class="status-label status-label--rounded status-label--success">Success</span>
      <span class="status-label status-label--rounded status-label--warning">Warning</span>
      <span class="status-label status-label--rounded status-label--error">Error</span>
      <span class="status-label status-label--rounded status-label--inactive">Inactive</span>
      <span class="status-label status-label--rounded status-label--disabled">Disabled</span>
    </div>
  </section>

  <section>
    <h2>Example — priority scale</h2>
    <div class="row">
      <span class="status-label status-label--success">Low</span>
      <span class="status-label status-label--warning">Medium</span>
      <span class="status-label status-label--error">High</span>
    </div>
  </section>

  <section>
    <h2>Dark Mode</h2>
    <div class="dark-demo" data-theme="dark">
      <h2>On dark background</h2>
      <div class="row">
        <span class="status-label status-label--information">Information</span>
        <span class="status-label status-label--success">Success</span>
        <span class="status-label status-label--warning">Warning</span>
        <span class="status-label status-label--error">Error</span>
        <span class="status-label status-label--inactive">Inactive</span>
        <span class="status-label status-label--disabled">Disabled</span>
      </div>
    </div>
  </section>

</body>
</html>
