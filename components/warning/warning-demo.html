<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="warning.css">
  <title>Warning Animation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
    section { margin-bottom: 40px; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 48px; margin-bottom: 16px; }
    .label { font-size: 11px; color: #A0A0A0; width: 96px; flex-shrink: 0; }
    .menu-item { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; }
    .dark-demo { background: var(--brand-3-high); border-radius: 12px; padding: 24px; }
    .dark-demo h2 { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <h1>Warning</h1>
  <p class="subtitle">Pulsing attention indicator — Zego Design System</p>

  <section>
    <h2>Sizes</h2>
    <div class="row"><span class="label">12 (default)</span>
      <span class="warning" role="status" aria-label="Warning"><span class="warning__ring"></span><span class="warning__dot"></span></span>
    </div>
    <div class="row"><span class="label">8</span>
      <span class="warning" role="status" aria-label="Warning" style="--warning-size:8px"><span class="warning__ring"></span><span class="warning__dot"></span></span>
    </div>
    <div class="row"><span class="label">16</span>
      <span class="warning" role="status" aria-label="Warning" style="--warning-size:16px"><span class="warning__ring"></span><span class="warning__dot"></span></span>
    </div>
  </section>

  <section>
    <h2>In context</h2>
    <div class="row">
      <span class="menu-item">Notifications
        <span class="warning" role="status" aria-label="New warning"><span class="warning__ring"></span><span class="warning__dot"></span></span>
      </span>
    </div>
  </section>

  <section>
    <h2>Dark Mode</h2>
    <div class="dark-demo" data-theme="dark">
      <h2>On dark background</h2>
      <div class="row">
        <span class="warning" role="status" aria-label="Warning"><span class="warning__ring"></span><span class="warning__dot"></span></span>
      </div>
    </div>
  </section>

</body>
</html>
