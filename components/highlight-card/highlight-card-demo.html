<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlight Card — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="highlight-card.css">
  <style>body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 600px; }</style>
</head>
<body>
  <div class="grid">
    <div class="highlight-card">
      <div class="info-field">
        <div class="info-field__content">
          <div class="info-field__head"><span class="info-field__label">Overdue</span></div>
          <span class="info-field__action">&pound;113.00</span>
        </div>
        <span class="info-field__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 12.5C17.0315 12.7761 16.8076 13 16.5315 13H7.53164C7.2555 13 7.03164 12.7761 7.03164 12.5V11.5C7.03164 11.2239 7.2555 11 7.53164 11H16.5315C16.8076 11 17.0315 11.2239 17.0315 11.5V12.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 8.5C17.0315 8.77614 16.8076 9 16.5315 9H7.53164C7.2555 9 7.03164 8.77614 7.03164 8.5V7.5C7.03164 7.22386 7.2555 7 7.53164 7H16.5315C16.8076 7 17.0315 7.22386 17.0315 7.5V8.5Z" fill="currentColor"/><path d="M3 21V3C3 1.89543 3.89543 1 5 1H18L18.0774 1.00098C19.6985 1.04203 21 2.36902 21 4V21C21 22.1046 20.1046 23 19 23H5C3.89543 23 3 22.1046 3 21ZM5 21H19V4C19 3.46499 18.5799 3.02803 18.0515 3.00122L18 3H5V21Z" fill="currentColor"/></svg></span>
      </div>
      <div class="highlight-card__sub">Payment due 3 days ago</div>
    </div>
    <div class="highlight-card highlight-card--success">
      <div class="info-field">
        <div class="info-field__content">
          <div class="info-field__head"><span class="info-field__label">Saved</span></div>
          <span class="info-field__action">&pound;42.00</span>
        </div>
        <span class="info-field__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 12.5C17.0315 12.7761 16.8076 13 16.5315 13H7.53164C7.2555 13 7.03164 12.7761 7.03164 12.5V11.5C7.03164 11.2239 7.2555 11 7.53164 11H16.5315C16.8076 11 17.0315 11.2239 17.0315 11.5V12.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 8.5C17.0315 8.77614 16.8076 9 16.5315 9H7.53164C7.2555 9 7.03164 8.77614 7.03164 8.5V7.5C7.03164 7.22386 7.2555 7 7.53164 7H16.5315C16.8076 7 17.0315 7.22386 17.0315 7.5V8.5Z" fill="currentColor"/><path d="M3 21V3C3 1.89543 3.89543 1 5 1H18L18.0774 1.00098C19.6985 1.04203 21 2.36902 21 4V21C21 22.1046 20.1046 23 19 23H5C3.89543 23 3 22.1046 3 21ZM5 21H19V4C19 3.46499 18.5799 3.02803 18.0515 3.00122L18 3H5V21Z" fill="currentColor"/></svg></span>
      </div>
      <div class="highlight-card__sub">vs. last month</div>
    </div>
    <div class="highlight-card highlight-card--warning">
      <div class="info-field">
        <div class="info-field__content">
          <div class="info-field__head"><span class="info-field__label">Pending</span></div>
          <span class="info-field__action">&pound;78.50</span>
        </div>
        <span class="info-field__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 12.5C17.0315 12.7761 16.8076 13 16.5315 13H7.53164C7.2555 13 7.03164 12.7761 7.03164 12.5V11.5C7.03164 11.2239 7.2555 11 7.53164 11H16.5315C16.8076 11 17.0315 11.2239 17.0315 11.5V12.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 8.5C17.0315 8.77614 16.8076 9 16.5315 9H7.53164C7.2555 9 7.03164 8.77614 7.03164 8.5V7.5C7.03164 7.22386 7.2555 7 7.53164 7H16.5315C16.8076 7 17.0315 7.22386 17.0315 7.5V8.5Z" fill="currentColor"/><path d="M3 21V3C3 1.89543 3.89543 1 5 1H18L18.0774 1.00098C19.6985 1.04203 21 2.36902 21 4V21C21 22.1046 20.1046 23 19 23H5C3.89543 23 3 22.1046 3 21ZM5 21H19V4C19 3.46499 18.5799 3.02803 18.0515 3.00122L18 3H5V21Z" fill="currentColor"/></svg></span>
      </div>
      <div class="highlight-card__sub">Awaiting confirmation</div>
    </div>
    <div class="highlight-card highlight-card--information">
      <div class="info-field">
        <div class="info-field__content">
          <div class="info-field__head"><span class="info-field__label">Balance</span></div>
          <span class="info-field__action">&pound;1,240</span>
        </div>
        <span class="info-field__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 12.5C17.0315 12.7761 16.8076 13 16.5315 13H7.53164C7.2555 13 7.03164 12.7761 7.03164 12.5V11.5C7.03164 11.2239 7.2555 11 7.53164 11H16.5315C16.8076 11 17.0315 11.2239 17.0315 11.5V12.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0315 8.5C17.0315 8.77614 16.8076 9 16.5315 9H7.53164C7.2555 9 7.03164 8.77614 7.03164 8.5V7.5C7.03164 7.22386 7.2555 7 7.53164 7H16.5315C16.8076 7 17.0315 7.22386 17.0315 7.5V8.5Z" fill="currentColor"/><path d="M3 21V3C3 1.89543 3.89543 1 5 1H18L18.0774 1.00098C19.6985 1.04203 21 2.36902 21 4V21C21 22.1046 20.1046 23 19 23H5C3.89543 23 3 22.1046 3 21ZM5 21H19V4C19 3.46499 18.5799 3.02803 18.0515 3.00122L18 3H5V21Z" fill="currentColor"/></svg></span>
      </div>
      <div class="highlight-card__sub">As of today</div>
    </div>
  </div>
</body>
</html>
