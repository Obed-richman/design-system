<!DOCTYPE html>
<html lang="en" data-sc-viewport>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card — Design System</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="../radio/radio.css">
  <link rel="stylesheet" href="../../tokens/typography.css">
  <link rel="stylesheet" href="product-card.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background-page); color: var(--text-primary); font-family: var(--font-family-base); min-height: 100vh; }
    .header { width: 100%; height: 104px; background: var(--brand-3-high); display: flex; align-items: center; justify-content: center; }
    .header__logo { display: inline-flex; align-items: center; color: var(--colour-white); }
    .header__logo svg { width: 110px; height: 32px; display: block; }
    .content { max-width: 876px; margin: 0 auto; padding: 24px 24px 96px; }
    .back-btn { margin-bottom: 24px; }
    .component-header { margin-bottom: 24px; }
    .component-header__name { font-family: var(--font-family-base); font-weight: var(--font-weight-bold); font-size: var(--font-size-title-4); line-height: var(--line-height-title-4); color: var(--text-primary); margin: 0; }
    .component-header__description { font-family: var(--font-family-base); font-weight: var(--font-weight-regular); font-size: var(--font-size-body-2); line-height: var(--line-height-body-2); color: var(--colour-grey-60); margin: 4px 0 0; }
    .variants { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  </style>
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>
</head>
<body>

  <header class="header">
    <span class="header__logo"><svg viewBox="0 0 110 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zego"><path d="M22.1028 8.61685H2.3732C1.80867 8.61685 1.36296 8.18585 1.36296 7.63993V3.87587C1.36296 3.32995 1.80867 2.89895 2.3732 2.89895H22.1028C22.6673 2.89895 23.113 3.32995 23.113 3.87587V7.63993C23.113 8.18585 22.6375 8.61685 22.1028 8.61685ZM48.9931 28.1267V24.3626C48.9931 23.8167 48.5474 23.3857 47.9828 23.3857H28.7583C28.1938 23.3857 27.7481 23.8167 27.7481 24.3626V28.1267C27.7481 28.6726 28.1938 29.1037 28.7583 29.1037H47.9828C48.5474 29.1037 48.9931 28.6726 48.9931 28.1267ZM9.29637 23.3857L16.3085 15.8862C16.6651 15.5129 16.6651 14.9094 16.279 14.5359L13.5156 11.8637C13.0997 11.4614 12.446 11.4902 12.0597 11.8924L1.60067 23.0983C1.42239 23.2708 1.33325 23.5006 1.33325 23.7593V28.1267C1.33325 28.6726 1.77894 29.1037 2.3435 29.1037H22.073C22.6376 29.1037 23.0832 28.6726 23.0832 28.1267V24.3626C23.0832 23.8167 22.6376 23.3857 22.073 23.3857H9.29637ZM48.9931 7.63993V3.87587C48.9931 3.32995 48.5474 2.89895 47.9828 2.89895H28.7583C28.1938 2.89895 27.7481 3.32995 27.7481 3.87587V17.8688C27.7481 18.415 28.1938 18.8457 28.7583 18.8457H44.12C44.6846 18.8457 45.1303 18.415 45.1303 17.8688V14.1336C45.1303 13.5877 44.6846 13.1567 44.12 13.1567H33.6612V8.61685H47.9828C48.5474 8.61685 48.9931 8.18585 48.9931 7.63993ZM71.3374 22.0352L74.1006 24.7073C74.5165 25.1096 74.487 25.7706 74.0411 26.1439C68.4848 30.7126 60.076 30.3678 54.995 25.0521C50.1222 19.9952 50.1222 12.0361 54.995 6.95034C60.076 1.6347 68.4848 1.26118 74.0411 5.85847C74.487 6.232 74.5165 6.89285 74.1006 7.29513L71.3374 9.96731C70.9808 10.3121 70.3865 10.3408 70.0004 10.0535C66.7912 7.58246 62.0075 7.8698 59.1847 10.973C56.5698 13.8175 56.5698 18.185 59.1847 21.0296C62.0075 24.1326 66.7912 24.4488 70.0004 21.9491C70.4163 21.6616 70.9808 21.6903 71.3374 22.0352ZM107.171 16.0014C107.171 23.357 100.991 29.3334 93.3844 29.3334C85.7779 29.3334 79.5976 23.357 79.5976 16.0014C79.5976 8.64557 85.7779 2.66911 93.3844 2.66911C100.991 2.66911 107.171 8.64557 107.171 16.0014ZM101.258 16.0014C101.258 11.8062 97.7225 8.38698 93.3844 8.38698C89.0464 8.38698 85.5104 11.8062 85.5104 16.0014C85.5104 20.1962 89.0464 23.6155 93.3844 23.6155C97.7523 23.6155 101.258 20.1962 101.258 16.0014ZM76.6559 17.8688V14.1336C76.6559 13.5877 76.2102 13.1567 75.6457 13.1567H64.4439C63.8793 13.1567 63.4336 13.5877 63.4336 14.1336V17.8688C63.4336 18.415 63.8793 18.8457 64.4439 18.8457H75.6457C76.2102 18.8457 76.6559 18.415 76.6559 17.8688Z" fill="currentColor"/></svg></span>
  </header>

  <main class="content">

    <a class="btn btn--secondary btn--large btn--pill back-btn" href="../../index.html">
      <span class="btn__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Back
    </a>

    <div class="component-header">
      <h1 class="component-header__name">Product Card</h1>
      <p class="component-header__description">Insurance product option — badge, "Best value" tag, benefits &amp; rewards banner × State — Zego Design System</p>
    </div>

    <div class="variants" id="cards"></div>

  </main>

  <script>
    var CAL = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"> <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 4C10.7761 4 11 4.22386 11 4.5V5H17V4.5C17 4.22386 17.2239 4 17.5 4H18.5C18.7761 4 19 4.22386 19 4.5V5H21.5C22.3284 5 23 5.67157 23 6.5V19C23 20.1046 22.1046 21 21 21H7C5.89543 21 5 20.1046 5 19V6.5C5 5.67157 5.67157 5 6.5 5H9V4.5C9 4.22386 9.22386 4 9.5 4H10.5ZM7 19H21V12H7V19ZM7 10H21V7H19V7.5C19 7.77614 18.7761 8 18.5 8H17.5C17.2239 8 17 7.77614 17 7.5V7H11V7.5C11 7.77614 10.7761 8 10.5 8H9.5C9.22386 8 9 7.77614 9 7.5V7H7V10Z" fill="currentColor"/> <path d="M13.5 1C13.7761 1 14 1.22386 14 1.5V2.5C14 2.77614 13.7761 3 13.5 3H3.5C3.22386 3 3 3.22386 3 3.5V14.5C3 14.7761 2.77614 15 2.5 15H1.5C1.22386 15 1 14.7761 1 14.5V3C1 1.89543 1.89543 1 3 1H13.5Z" fill="currentColor"/> </svg>';
    var TICK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg>';
    var BENEFITS = ['Up to 25% off for good driving', 'Earn up to £60 in rewards', 'Privacy-first — your location stays yours'];
    /* The real gift-card faces 003 puts in the banner's image slot, leftmost on top. */
    var REWARDS = ['amazon', 'just-eat', 'starbucks'];

    function bullets() {
      return '<div class="product-card__benefits">' + BENEFITS.map(function (b) {
        return '<div class="product-card__benefit"><span class="product-card__benefit-icon">' + TICK + '</span><span class="product-card__benefit-text">' + b + '</span></div>';
      }).join('') + '</div>';
    }
    function rewards() {
      return '<div class="product-card__rewards">' + REWARDS.map(function (name) {
        return '<span class="product-card__reward"><img src="../../assets/rewards/' + name + '.jpg" alt=""></span>';
      }).join('') + '</div>';
    }
    function productCard(opts) {
      var state = opts.active ? ' product-card--active' : (opts.hover ? ' product-card--hover' : '');
      return '<div class="product-card' + state + '">'
        + '<div class="product-card__header">'
        +   '<div class="product-card__top">'
        +     '<span class="product-card__badge">' + CAL + '</span>'
        +     '<div class="product-card__meta">'
        +       '<span class="product-card__tag">Best value</span>'
        +       '<label class="radio"><input class="radio__input" type="radio" name="product"' + (opts.active ? ' checked' : '') + '><span class="radio__control"></span></label>'
        +     '</div>'
        +   '</div>'
        +   '<div>'
        +     '<h3 class="product-card__title">Telematics</h3>'
        +     '<p class="product-card__subtitle">Get up to £60 a year in rewards</p>'
        +   '</div>'
        +   bullets()
        + '</div>'
        /* The banner IS a Marketing Banner — its markup, with the reward stack
           dropped into the image slot. Product Card only restyles it. */
        + '<div class="product-card__banner"><div class="marketing-banner">'
        +   '<div class="marketing-banner__content"><div class="marketing-banner__text">'
        +     '<p class="marketing-banner__title">Drive well. Get rewards.</p>'
        +   '</div></div>'
        +   '<div class="marketing-banner__image">' + rewards() + '</div>'
        + '</div></div>'
        + '</div>';
    }

    /* The other thing 003 puts top-left: a Zego Product lockup instead of a glyph
       badge, on the cards that ARE a Zego product. The lockup names the product, so
       the card carries no title of its own and the description follows the top row
       directly — .product-card__top + .product-card__subtitle drops the 4px that
       would otherwise sit under a title. */
    function lockupCard() {
      return '<div class="product-card">'
        + '<div class="product-card__header">'
        +   '<div class="product-card__top">'
        +     '<span class="product-card__lockup"><img src="../../brand/zego-sense.svg" alt="Zego Sense"></span>'
        +     '<div class="product-card__meta">'
        +       '<label class="radio"><input class="radio__input" type="radio" name="product-lockup"><span class="radio__control"></span></label>'
        +     '</div>'
        +   '</div>'
        +   '<p class="product-card__subtitle">App-based telematics that rewards good driving.</p>'
        +   bullets()
        + '</div>'
        + '</div>';
    }

    /* The three Figma states. Hover is forced with the modifier so it can be seen
       without a pointer; on a real card it comes from :hover. */
    document.getElementById('cards').innerHTML = [
      productCard({}),
      productCard({ hover: true }),
      productCard({ active: true }),
      lockupCard()
    ].join('');
  </script>

</body>
</html>
