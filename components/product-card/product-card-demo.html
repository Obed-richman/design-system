<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../radio/radio.css">
  <link rel="stylesheet" href="product-card.css">
  <style>
    body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); }
  </style>
</head>
<body>

  <div class="product-card product-card--active">
    <div class="product-card__header">
      <div class="product-card__top">
        <span class="product-card__badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 5C1 3.89543 1.89543 3 3 3H21C22.1046 3 23 3.89543 23 5V21C23 22.1046 22.1046 23 21 23H3C1.89543 23 1 22.1046 1 21V5ZM21 5L3 5V21H21V5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M21 10L2 10L2 8L21 8V10Z" fill="currentColor"/><path d="M16 1.5C16 1.22386 16.2239 1 16.5 1H17.5C17.7761 1 18 1.22386 18 1.5V4.25C18 4.52614 17.7761 4.75 17.5 4.75H16.5C16.2239 4.75 16 4.52614 16 4.25V1.5Z" fill="currentColor"/><path d="M6 1.5C6 1.22386 6.22386 1 6.5 1H7.5C7.77614 1 8 1.22386 8 1.5V4.25C8 4.52614 7.77614 4.75 7.5 4.75H6.5C6.22386 4.75 6 4.52614 6 4.25V1.5Z" fill="currentColor"/></svg></span>
        <div class="product-card__meta">
          <span class="product-card__tag">Best value</span>
          <label class="radio"><input class="radio__input" type="radio" name="product" checked><span class="radio__control"></span></label>
        </div>
      </div>
      <div>
        <h3 class="product-card__title">Telematics</h3>
        <p class="product-card__subtitle">Get up to £60 a year in rewards</p>
      </div>
      <div class="product-card__benefits">
        <div class="product-card__benefit"><span class="product-card__benefit-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span><span class="product-card__benefit-text">Up to 25% off for good driving</span></div>
        <div class="product-card__benefit"><span class="product-card__benefit-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span><span class="product-card__benefit-text">Earn up to £60 in rewards</span></div>
        <div class="product-card__benefit"><span class="product-card__benefit-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span><span class="product-card__benefit-text">Privacy-first — your location stays yours</span></div>
      </div>
    </div>
    <div class="product-card__banner"><div class="product-card__banner-inner">
      <p class="product-card__banner-text">Drive well. Pay less. Get rewards.</p>
      <div class="product-card__rewards">
        <span class="product-card__reward" style="background:#232f3e"></span>
        <span class="product-card__reward" style="background:#ff8000"></span>
        <span class="product-card__reward" style="background:#00704a"></span>
      </div>
    </div></div>
  </div>

</body>
</html>
