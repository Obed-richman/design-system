<!DOCTYPE html>
<html lang="en" data-sc-viewport>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustpilot Reviews — Design System</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="../../tokens/typography.css">
  <link rel="stylesheet" href="trustpilot-reviews.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background-page); color: var(--text-primary); font-family: var(--font-family-base); min-height: 100vh; }
    .header { width: 100%; height: 104px; background: var(--brand-3-high); display: flex; align-items: center; justify-content: center; }
    .header__logo { display: inline-flex; align-items: center; color: var(--colour-white); }
    .header__logo svg { width: 110px; height: 32px; display: block; }
    .content { max-width: 1100px; margin: 0 auto; padding: 24px 24px 96px; }
    .back-btn { margin-bottom: 24px; }
    .component-header { margin-bottom: 24px; }
    .component-header__name { font-family: var(--font-family-base); font-weight: var(--font-weight-bold); font-size: var(--font-size-title-4); line-height: var(--line-height-title-4); color: var(--text-primary); margin: 0; }
    .component-header__description { font-family: var(--font-family-base); font-weight: var(--font-weight-regular); font-size: var(--font-size-body-2); line-height: var(--line-height-body-2); color: var(--colour-grey-60); margin: 4px 0 0; }
    .stage { background: var(--background-primary); border-radius: 16px; border: 1px solid var(--border-primary); padding: 40px 24px; }
    /* Mobile viewport toggle → reproduce the component's mobile layout */
    html[data-viewport="mobile"] .content { max-width: 420px; }
    html[data-viewport="mobile"] .stage { padding: 24px 0; }
    html[data-viewport="mobile"] .tp-reviews { gap: 16px; }
    html[data-viewport="mobile"] .tp-reviews__title { font-size: 28px; line-height: 32px; }
    html[data-viewport="mobile"] .tp-reviews .tp-reviews__nav { display: none; }
    html[data-viewport="mobile"] .tp-reviews__carousel { gap: 0; }
    html[data-viewport="mobile"] .tp-reviews__track { gap: 12px; padding-inline: 6%; }
    html[data-viewport="mobile"] .tp-review { flex: 0 0 88%; padding: 20px; }
    html[data-viewport="mobile"] .tp-reviews__pagination { display: flex; }
  </style>
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>
</head>
<body>

  <header class="header">
    <span class="header__logo"><svg viewBox="0 0 110 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zego"><path d="M22.1028 8.61685H2.3732C1.80867 8.61685 1.36296 8.18585 1.36296 7.63993V3.87587C1.36296 3.32995 1.80867 2.89895 2.3732 2.89895H22.1028C22.6673 2.89895 23.113 3.32995 23.113 3.87587V7.63993C23.113 8.18585 22.6375 8.61685 22.1028 8.61685ZM48.9931 28.1267V24.3626C48.9931 23.8167 48.5474 23.3857 47.9828 23.3857H28.7583C28.1938 23.3857 27.7481 23.8167 27.7481 24.3626V28.1267C27.7481 28.6726 28.1938 29.1037 28.7583 29.1037H47.9828C48.5474 29.1037 48.9931 28.6726 48.9931 28.1267ZM9.29637 23.3857L16.3085 15.8862C16.6651 15.5129 16.6651 14.9094 16.279 14.5359L13.5156 11.8637C13.0997 11.4614 12.446 11.4902 12.0597 11.8924L1.60067 23.0983C1.42239 23.2708 1.33325 23.5006 1.33325 23.7593V28.1267C1.33325 28.6726 1.77894 29.1037 2.3435 29.1037H22.073C22.6376 29.1037 23.0832 28.6726 23.0832 28.1267V24.3626C23.0832 23.8167 22.6376 23.3857 22.073 23.3857H9.29637ZM48.9931 7.63993V3.87587C48.9931 3.32995 48.5474 2.89895 47.9828 2.89895H28.7583C28.1938 2.89895 27.7481 3.32995 27.7481 3.87587V17.8688C27.7481 18.415 28.1938 18.8457 28.7583 18.8457H44.12C44.6846 18.8457 45.1303 18.415 45.1303 17.8688V14.1336C45.1303 13.5877 44.6846 13.1567 44.12 13.1567H33.6612V8.61685H47.9828C48.5474 8.61685 48.9931 8.18585 48.9931 7.63993ZM71.3374 22.0352L74.1006 24.7073C74.5165 25.1096 74.487 25.7706 74.0411 26.1439C68.4848 30.7126 60.076 30.3678 54.995 25.0521C50.1222 19.9952 50.1222 12.0361 54.995 6.95034C60.076 1.6347 68.4848 1.26118 74.0411 5.85847C74.487 6.232 74.5165 6.89285 74.1006 7.29513L71.3374 9.96731C70.9808 10.3121 70.3865 10.3408 70.0004 10.0535C66.7912 7.58246 62.0075 7.8698 59.1847 10.973C56.5698 13.8175 56.5698 18.185 59.1847 21.0296C62.0075 24.1326 66.7912 24.4488 70.0004 21.9491C70.4163 21.6616 70.9808 21.6903 71.3374 22.0352ZM107.171 16.0014C107.171 23.357 100.991 29.3334 93.3844 29.3334C85.7779 29.3334 79.5976 23.357 79.5976 16.0014C79.5976 8.64557 85.7779 2.66911 93.3844 2.66911C100.991 2.66911 107.171 8.64557 107.171 16.0014ZM101.258 16.0014C101.258 11.8062 97.7225 8.38698 93.3844 8.38698C89.0464 8.38698 85.5104 11.8062 85.5104 16.0014C85.5104 20.1962 89.0464 23.6155 93.3844 23.6155C97.7523 23.6155 101.258 20.1962 101.258 16.0014ZM76.6559 17.8688V14.1336C76.6559 13.5877 76.2102 13.1567 75.6457 13.1567H64.4439C63.8793 13.1567 63.4336 13.5877 63.4336 14.1336V17.8688C63.4336 18.415 63.8793 18.8457 64.4439 18.8457H75.6457C76.2102 18.8457 76.6559 18.415 76.6559 17.8688Z" fill="currentColor"/></svg></span>
  </header>

  <main class="content">

    <a class="btn btn--secondary btn--large btn--pill back-btn" href="../../index.html">
      <span class="btn__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Back
    </a>

    <div class="component-header">
      <h1 class="component-header__name">Trustpilot Reviews</h1>
      <p class="component-header__description">Customer review carousel with Trustpilot ratings &amp; rating lockup — Zego Design System</p>
    </div>

    <div class="stage">
      <section class="tp-reviews" id="widget"></section>
    </div>

  </main>

  <script>
    var STAR = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg>';

    function stars() {
      var out = '<div class="trustpilot trustpilot--green trustpilot--24" role="img" aria-label="Rated 5 out of 5 on Trustpilot">';
      for (var i = 0; i < 5; i++) out += '<span class="trustpilot__star trustpilot__star--full">' + STAR + '</span>';
      return out + '</div>';
    }

    // review: {title, body, name, ago}
    function review(r) {
      return '<div class="tp-review">'
        + stars()
        + '<div class="tp-review__review"><p class="tp-review__title">' + r.title + '</p>'
        +   '<p class="tp-review__body">' + r.body + '</p></div>'
        + '<p class="tp-review__name"><a href="#">' + r.name + '</a> - ' + r.ago + '</p>'
        + '</div>';
    }

    var REVIEWS = [
      { title: 'Helpful customer service', body: 'Amaju was a great guy and helped me through the process easily when I forgot to renew my policy. Top quality and perfect from start to finish.', name: 'yared mamo', ago: '6 days ago' },
      { title: 'Exceptional customer service…', body: 'I want to give a huge thank you to Elaine for her outstanding customer service. She was incredibly patient, knowledgeable, and proactive.', name: 'Priya S', ago: '1 week ago' },
      { title: 'Outstanding support experience', body: 'I have always had a good experience with Zego — nice and helpful staff. Today I had a problem with my insurance and it was sorted in 4 minutes.', name: 'Mohammed K', ago: '2 weeks ago' },
      { title: 'Quick and easy', body: 'Set up my cover in minutes and the app is really simple to use. Would recommend to any driver looking for flexible insurance.', name: 'Chloe R', ago: '3 weeks ago' },
      { title: 'Great value', body: 'Best quote I found anywhere and the cover is comprehensive. Renewal was painless too.', name: 'James T', ago: '1 month ago' }
    ];

    function pagination(count, active) {
      var dots = '';
      for (var i = 0; i < count; i++) {
        var on = i === active;
        dots += '<span class="pagination__dot' + (on ? ' pagination__dot--active' : '') + '" role="tab" aria-selected="' + on + '"></span>';
      }
      return '<div class="pagination" role="tablist" aria-label="Review">' + dots + '</div>';
    }

    var ARROW_L = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var ARROW_R = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    document.getElementById('widget').innerHTML =
        '<div class="tp-reviews__head">'
      +   '<h2 class="tp-reviews__title">Rated 5* by 8,000+ drivers</h2>'
      +   '<p class="tp-reviews__subtitle">Here’s what our customers are saying about us</p>'
      + '</div>'
      + '<div class="tp-reviews__carousel">'
      +   '<button class="btn btn--secondary btn--fab tp-reviews__nav" type="button" data-dir="prev" aria-label="Previous reviews">' + ARROW_L + '</button>'
      +   '<div class="tp-reviews__track">' + REVIEWS.map(review).join('') + '</div>'
      +   '<button class="btn btn--secondary btn--fab tp-reviews__nav" type="button" data-dir="next" aria-label="Next reviews">' + ARROW_R + '</button>'
      + '</div>'
      + '<div class="tp-reviews__pagination">' + pagination(REVIEWS.length, 0) + '</div>'
      + '<div class="tp-reviews__rating">'
      +   '<p class="tp-reviews__rating-text">Rated <strong>4.4</strong> / 5 based on <strong>10,349 reviews</strong>. Showing our 5* reviews.</p>'
      +   '<span class="trustpilot-logo"><span class="trustpilot-logo__star"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span><span class="trustpilot-logo__wordmark">Trustpilot</span></span>'
      + '</div>';
  </script>
  <script src="trustpilot-reviews.js"></script>

</body>
</html>
