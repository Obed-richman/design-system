    // card: {icon, title, desc, price, added}
    function extraCover(o) {
      return '<div class="extra-cover' + (o.added ? ' extra-cover--added' : '') + '">'
        + '<div class="extra-cover__content">'
        +   '<div class="extra-cover__top">'
        +     '<span class="extra-cover__badge">' + ICONS[o.icon] + '</span>'
        +     '<span class="extra-cover__added">Added</span>'
        +   '</div>'
        +   '<h3 class="extra-cover__title">' + o.title + '</h3>'
        +   '<p class="extra-cover__desc">' + o.desc + ' <a class="extra-cover__link" href="#">Read more</a></p>'
        +   '<div class="extra-cover__tile">'
        +     '<span class="extra-cover__tile-icon">' + ICONS.docs + '</span>'
        +     '<span class="extra-cover__tile-label">Insurance information Document (IPID)</span>'
        +     '<button class="btn btn--secondary btn--pill btn--small" type="button">Download</button>'
        +   '</div>'
        + '</div>'
        + '<div class="extra-cover__footer">'
        +   '<p class="extra-cover__price">' + o.price + '</p>'
        +   '<button class="btn ' + (o.added ? 'btn--secondary' : 'btn--primary') + ' btn--pill btn--small extra-cover__add" type="button" aria-pressed="' + (!!o.added) + '">'
        +     '<span class="btn__icon extra-cover__add-plus">' + ICONS.plus + '</span>'
        +     '<span class="btn__icon extra-cover__add-minus">' + ICONS.minus + '</span>'
        +     '<span class="extra-cover__add-label">' + (o.added ? 'Remove' : 'Add') + '</span>'
        +   '</button>'
        + '</div>'
        + '</div>';
    }

    var CARDS = [
      { icon: 'breakdown', title: 'Breakdown cover', desc: 'This includes combined roadside and recovery within the UK.', price: '£59.99', added: true },
      { icon: 'replace', title: 'Vehicle replacement cover', desc: 'Get a replacement vehicle for up to 14 days if yours is unroadworthy, beyond economic repair, or stolen.', price: '£59.99', added: false },
      { icon: 'ncd', title: 'No claims discount (NCD)', desc: 'Protect up to 5 years of your no claims discount, against one at-fault claim.', price: '£59.99', added: false },
      { icon: 'legal', title: 'Legal expenses', desc: 'Covers legal costs for accidents, offences, and disputes, plus a legal helpline.', price: '£59.99', added: false }
    ];

    document.getElementById('addons').innerHTML =
        '<div class="addons__head">'
      +   '<h2 class="addons__title">Optional extras</h2>'
      +   '<p class="addons__subtitle">We offer extra protection for stress-free driving.</p>'
      + '</div>'
      + '<div class="addons__cards">' + CARDS.map(extraCover).join('') + '</div>';
