<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="vehicle-registration.css">
  <title>Vehicle Registration Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 28px; }
    .card { max-width: 420px; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 28px; }
    .card h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .card p.lead { color: #555; font-size: 15px; margin: 0 0 20px; }
    .actions { margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Vehicle Registration</h1>
  <p class="subtitle">UK number-plate input — Zego Design System</p>

  <div class="card">
    <h2>Find your car</h2>
    <p class="lead">Enter your registration and we'll look up the details automatically.</p>

    <div class="veh-reg">
      <div class="veh-reg__label">
        <p class="veh-reg__label-title">Registration number</p>
        <p class="veh-reg__label-support">As shown on your number plate</p>
      </div>
      <div class="veh-reg__field">
        <span class="veh-reg__country">
          <span class="veh-reg__flag"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"> <g clip-path="url(#flag-uk-clip)"> <g transform="translate(-16 -14)"><rect width="36" height="24" transform="translate(8 12)" fill="#FF4E4E"/> <g id="Clip path group"> <mask id="flag-uk-mask" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="2" y="12" width="48" height="24"> <g id="s"> <path id="Vector" d="M2 12L2 36L50 36L50 12L2 12Z" fill="white"/> </g> </mask> <g mask="url(#flag-uk-mask)"> <g id="Group"> <path id="Vector_2" d="M1.99902 12.0001L1.99902 36.0001L49.999 36.0001L49.999 12.0001L1.99902 12.0001Z" fill="#001E6D"/> <path id="Vector (Stroke)" fill-rule="evenodd" clip-rule="evenodd" d="M20.6325 24.0001L0.925781 14.1468L3.07241 9.85352L25.9991 21.3169L48.9258 9.85352L51.0724 14.1468L31.3657 24.0001L51.0724 33.8535L48.9258 38.1468L25.9991 26.6834L3.07241 38.1468L0.925781 33.8535L20.6325 24.0001Z" fill="white"/> <g id="Clip path group_2"> <mask id="mask1_4394_29934" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="1" y="12" width="49" height="25"> <g id="t"> <path id="Vector_3" d="M25.999 24.0001L49.999 24.0001V36.0001L25.999 24.0001ZM25.999 24.0001L25.999 36.0001L1.99902 36.0001L25.999 24.0001ZM25.999 24.0001L1.99902 24.0001L1.99902 12.0001L25.999 24.0001ZM25.999 24.0001L25.999 12.0001L49.999 12.0001L25.999 24.0001Z" fill="white"/> </g> </mask> <g mask="url(#mask1_4394_29934)"> <path id="Vector (Stroke)_2" fill-rule="evenodd" clip-rule="evenodd" d="M22.421 24.0001L1.2832 13.4312L2.71429 10.569L25.9987 22.2113L49.2832 10.569L50.7143 13.4312L29.5765 24.0001L50.7143 34.569L49.2832 37.4312L25.9987 25.789L2.71429 37.4312L1.2832 34.569L22.421 24.0001Z" fill="#C8102E"/> </g> </g> <path id="Vector (Stroke)_3" fill-rule="evenodd" clip-rule="evenodd" d="M21.999 20.0001L21.999 12.0001L29.999 12.0001L29.999 20.0001L49.999 20.0001L49.999 28.0001L29.999 28.0001L29.999 36.0001L21.999 36.0001L21.999 28.0001L1.99902 28.0001L1.99902 20.0001L21.999 20.0001Z" fill="white"/> <path id="Vector (Stroke)_4" fill-rule="evenodd" clip-rule="evenodd" d="M23.599 21.6001L23.599 12.0001L28.399 12.0001L28.399 21.6001L49.999 21.6001L49.999 26.4001L28.399 26.4001L28.399 36.0001H23.599L23.599 26.4001L1.99902 26.4001L1.99902 21.6001L23.599 21.6001Z" fill="#C8102E"/> </g> </g> </g></g> </g> <defs><clipPath id="flag-uk-clip"><rect width="20" height="20" rx="2" fill="white"/></clipPath></defs> </svg></span>
          <span class="veh-reg__gb">GB</span>
          <span class="veh-reg__chevron"><svg viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </span>
        <input class="veh-reg__input" type="text" placeholder="SH48 HSA" aria-label="Registration">
      </div>
    </div>

    <div class="actions">
      <button class="btn btn--primary btn--pill btn--large" type="button">Find my car</button>
    </div>
  </div>

</body>
</html>
