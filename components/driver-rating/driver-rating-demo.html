<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Rating Progress — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="driver-rating.css">
  <style>body { margin: 0; padding: 24px; background: var(--surface-brand-3-high); font-family: var(--font-family-base); }
    .stage { max-width: 311px; }</style>
</head>
<body>
  <div class="stage">
  <div class="driver-rating driver-rating--at-risk" role="img" aria-label="Driver rating: At Risk"><div class="driver-rating__bars"><div class="progress-track progress-track--marker" style="--progress-track-value: 100"><div class="progress-track__fill"><span class="progress-track__indicator"></span></div></div><div class="progress-track" style="--progress-track-value: 0"><div class="progress-track__fill"><span class="progress-track__indicator"></span></div></div><div class="progress-track" style="--progress-track-value: 0"><div class="progress-track__fill"><span class="progress-track__indicator"></span></div></div><div class="progress-track" style="--progress-track-value: 0"><div class="progress-track__fill"><span class="progress-track__indicator"></span></div></div><div class="progress-track" style="--progress-track-value: 0"><div class="progress-track__fill"><span class="progress-track__indicator"></span></div></div></div><div class="driver-rating__labels"><span>At risk</span><span>Excellent</span></div></div>
  </div>
</body>
</html>
