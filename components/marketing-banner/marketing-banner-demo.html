<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Banner — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="marketing-banner.css">
  <style>
    body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  </style>
</head>
<body>

  <div class="marketing-banner">
    <div class="marketing-banner__content">
      <div class="marketing-banner__text">
        <p class="marketing-banner__title">Earn rewards for good driving</p>
        <p class="marketing-banner__paragraph">Drive well and get up to £60 a year back in rewards.</p>
      </div>
      <button class="btn btn--secondary btn--pill btn--small" type="button">Learn more</button>
    </div>
    <div class="marketing-banner__image"></div>
  </div>

  <div class="marketing-banner marketing-banner--vertical">
    <div class="marketing-banner__content">
      <div class="marketing-banner__text">
        <p class="marketing-banner__title">Earn rewards for good driving</p>
        <p class="marketing-banner__paragraph">Drive well and get up to £60 a year back in rewards.</p>
      </div>
      <button class="btn btn--secondary btn--pill btn--small" type="button">Learn more</button>
    </div>
    <div class="marketing-banner__image"></div>
  </div>

</body>
</html>
