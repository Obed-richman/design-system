<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="divider.css">
  <title>Divider Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 32px; }
    .card { max-width: 420px; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 24px; }
    .card h2 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .card p { margin: 0; font-size: 14px; color: #555; }
    .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .total { font-weight: 700; }
    .my-16 { margin: 16px 0; }
    .my-20 { margin: 20px 0; }
  </style>
</head>
<body>

  <h1>Divider</h1>
  <p class="subtitle">Separators — Zego Design System</p>

  <div class="card">
    <h2>Your quote</h2>
    <p>Comprehensive cover · 12 months</p>

    <hr class="divider my-16">

    <div class="row"><span>Premium</span><span>£412.00</span></div>
    <div class="row"><span>Breakdown cover</span><span>£24.00</span></div>
    <div class="row"><span>Admin fee</span><span>£8.50</span></div>

    <hr class="divider divider--thick my-16">

    <div class="row total"><span>Total</span><span>£444.50</span></div>

    <div class="divider-text my-20"><span class="divider-text__label">or pay monthly</span></div>

    <div class="row"><span>12 × monthly</span><span>£38.20</span></div>
  </div>

</body>
</html>
