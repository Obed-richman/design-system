<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkbox Component</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="checkbox.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; } .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
  section { margin-bottom: 40px; } h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 32px; margin-bottom: 12px; }
  .dark-bg { background: var(--colour-navy-70, #00134C); border-radius: 16px; padding: 24px; display:flex; flex-direction:column; gap:12px; }
  .dark-bg h2 { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<h1>Checkbox</h1><p class="subtitle">Checked × State × Size — Zego Design System</p>
<section><h2>Default</h2>
      <div class="row">
        <label class="checkbox"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Unchecked</span></label>
        <label class="checkbox"><input class="checkbox__input" type="checkbox" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Checked</span></label>
      </div>
</section>
<section><h2>Error</h2>
      <div class="row">
        <label class="checkbox checkbox--error"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Unchecked</span></label>
        <label class="checkbox checkbox--error"><input class="checkbox__input" type="checkbox" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Checked</span></label>
      </div>
</section>
<section><h2>Disabled</h2>
      <div class="row">
        <label class="checkbox checkbox--disabled"><input class="checkbox__input" type="checkbox" disabled><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Unchecked</span></label>
        <label class="checkbox checkbox--disabled"><input class="checkbox__input" type="checkbox" checked disabled><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Checked</span></label>
      </div>
</section>
<section><h2>Small</h2>
      <div class="row">
        <label class="checkbox checkbox--small"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Unchecked</span></label>
        <label class="checkbox checkbox--small"><input class="checkbox__input" type="checkbox" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Checked</span></label>
      </div>
</section>
<section><h2>Dark Mode</h2>
  <div class="dark-bg" data-theme="dark">
        <label class="checkbox"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Unchecked</span></label>
        <label class="checkbox"><input class="checkbox__input" type="checkbox" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Checked</span></label>
        <label class="checkbox checkbox--error"><input class="checkbox__input" type="checkbox" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Error</span></label>
        <label class="checkbox checkbox--disabled"><input class="checkbox__input" type="checkbox" checked disabled><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="checkbox__label">Disabled</span></label>
  </div>
</section>
</body>
</html>
