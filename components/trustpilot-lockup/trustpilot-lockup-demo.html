<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../trustpilot/trustpilot.css">
  <link rel="stylesheet" href="trustpilot-lockup.css">
  <title>Trustpilot Lockup Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 0; color: #27252d; }
    .hero { max-width: 720px; margin: 48px auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 24px; padding: 48px; text-align: center; }
    .hero h1 { font-size: 32px; font-weight: 700; margin: 0 0 12px; }
    .hero p { color: #737373; font-size: 16px; margin: 0 0 28px; }
    .hero__tp { display: inline-flex; }
    .footer { max-width: 720px; margin: 0 auto 48px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 8px; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Insurance that moves with you</h1>
    <p>Flexible cover for cars, vans and everything in between.</p>
    <div class="hero__tp">
      <div class="trustpilot-lockup">
        <span class="trustpilot-lockup__label">Excellent</span>
        <div class="trustpilot trustpilot--green trustpilot--24" role="img" aria-label="Rated 4.5 out of 5 on Trustpilot">
          <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
          <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
          <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
          <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
          <span class="trustpilot__star trustpilot__star--half"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
        </div>
        <span class="trustpilot-lockup__text">Trustpilot</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="trustpilot-lockup trustpilot-lockup--stacked trustpilot-lockup--left trustpilot-lockup--small">
      <span class="trustpilot-logo"><span class="trustpilot-logo__star"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span><span class="trustpilot-logo__wordmark">Trustpilot</span></span>
      <div class="trustpilot trustpilot--green trustpilot--16" role="img" aria-label="Rated 4.3 out of 5 on Trustpilot">
        <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
        <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
        <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
        <span class="trustpilot__star trustpilot__star--full"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
        <span class="trustpilot__star trustpilot__star--half"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5l2.955 6.363 6.795.79-5.02 4.64 1.35 6.707L12 17.1l-6.08 3.4 1.35-6.707-5.02-4.64 6.795-.79L12 1.5z" fill="currentColor"/></svg></span>
      </div>
      <span class="trustpilot-lockup__text">Trustscore <strong>4.3</strong> | <strong>15,321</strong> reviews</span>
    </div>
  </div>

</body>
</html>
