    var TABS = ['Home','Insights','Policies','Documents','Discover','Claims','Rewards','More'];

    // Each item carries BOTH glyphs; CSS shows the outline, or the fill when active.
    function item(tab, active) {
      return '<a class="bottom-nav__item' + (active ? ' bottom-nav__item--active' : '') + '" href="#"'
        + (active ? ' aria-current="page"' : '') + '>'
        + '<span class="bottom-nav__icon">'
        +   '<span class="bottom-nav__glyph bottom-nav__glyph--line">' + ICONS[tab].line + '</span>'
        +   '<span class="bottom-nav__glyph bottom-nav__glyph--fill">' + ICONS[tab].fill + '</span>'
        + '</span>'
        + '<span class="bottom-nav__label">' + tab + '</span></a>';
    }

    // Working bar — Home active, three others (click to switch)
    document.getElementById('bar').innerHTML =
      item('Home',true) + item('Insights',false) + item('Policies',false)
      + item('Claims',false);

    // iOS Liquid Glass — Sense product (Home active)
    document.getElementById('barIos').innerHTML =
      item('Home',true) + item('Insights',false)
      + item('Policies',false) + item('Claims',false);
