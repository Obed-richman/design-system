<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Input — Design System</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="../../tokens/typography.css">
  <link rel="stylesheet" href="input.css">
  <style>
    /* Demo / layout styles only — all input appearance comes from input.css */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background-page);
      color: var(--text-primary);
      font-family: var(--font-family-base);
      min-height: 100vh;
    }

    /* ---- Header ---- */
    .header {
      width: 100%;
      height: 104px;
      background: var(--brand-3-high);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header__logo { display: inline-flex; align-items: center; color: var(--colour-white); }
    .header__logo svg { width: 110px; height: 32px; display: block; }

    /* ---- Content ---- */
    .content {
      max-width: 876px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    /* ---- Back button ---- */
    .back-btn { margin-bottom: 24px; }

    /* ---- Component title section ---- */
    .component-header { margin-bottom: 24px; }
    .component-header__name {
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-title-4);
      line-height: var(--line-height-title-4);
      color: var(--text-primary);
      margin: 0;
    }
    .component-header__description {
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-regular);
      font-size: var(--font-size-body-2);
      line-height: var(--line-height-body-2);
      color: var(--colour-grey-60);
      margin: 4px 0 0;
    }

    /* ---- Variants container ---- */
    .variants {
      background: var(--colour-white);
      border-radius: 16px;
      border: 1px solid var(--border-primary);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .variant-group { display: flex; flex-direction: column; gap: 16px; }
    .variant-group__label {
      font-family: var(--font-family-base);
      font-size: var(--font-size-subtitle-3);
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--colour-grey-60);
      margin: 0;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }
  </style>
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>
</head>
<body>

  <header class="header">
    <span class="header__logo"><svg viewBox="0 0 110 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zego"><path d="M22.1028 8.61685H2.3732C1.80867 8.61685 1.36296 8.18585 1.36296 7.63993V3.87587C1.36296 3.32995 1.80867 2.89895 2.3732 2.89895H22.1028C22.6673 2.89895 23.113 3.32995 23.113 3.87587V7.63993C23.113 8.18585 22.6375 8.61685 22.1028 8.61685ZM48.9931 28.1267V24.3626C48.9931 23.8167 48.5474 23.3857 47.9828 23.3857H28.7583C28.1938 23.3857 27.7481 23.8167 27.7481 24.3626V28.1267C27.7481 28.6726 28.1938 29.1037 28.7583 29.1037H47.9828C48.5474 29.1037 48.9931 28.6726 48.9931 28.1267ZM9.29637 23.3857L16.3085 15.8862C16.6651 15.5129 16.6651 14.9094 16.279 14.5359L13.5156 11.8637C13.0997 11.4614 12.446 11.4902 12.0597 11.8924L1.60067 23.0983C1.42239 23.2708 1.33325 23.5006 1.33325 23.7593V28.1267C1.33325 28.6726 1.77894 29.1037 2.3435 29.1037H22.073C22.6376 29.1037 23.0832 28.6726 23.0832 28.1267V24.3626C23.0832 23.8167 22.6376 23.3857 22.073 23.3857H9.29637ZM48.9931 7.63993V3.87587C48.9931 3.32995 48.5474 2.89895 47.9828 2.89895H28.7583C28.1938 2.89895 27.7481 3.32995 27.7481 3.87587V17.8688C27.7481 18.415 28.1938 18.8457 28.7583 18.8457H44.12C44.6846 18.8457 45.1303 18.415 45.1303 17.8688V14.1336C45.1303 13.5877 44.6846 13.1567 44.12 13.1567H33.6612V8.61685H47.9828C48.5474 8.61685 48.9931 8.18585 48.9931 7.63993ZM71.3374 22.0352L74.1006 24.7073C74.5165 25.1096 74.487 25.7706 74.0411 26.1439C68.4848 30.7126 60.076 30.3678 54.995 25.0521C50.1222 19.9952 50.1222 12.0361 54.995 6.95034C60.076 1.6347 68.4848 1.26118 74.0411 5.85847C74.487 6.232 74.5165 6.89285 74.1006 7.29513L71.3374 9.96731C70.9808 10.3121 70.3865 10.3408 70.0004 10.0535C66.7912 7.58246 62.0075 7.8698 59.1847 10.973C56.5698 13.8175 56.5698 18.185 59.1847 21.0296C62.0075 24.1326 66.7912 24.4488 70.0004 21.9491C70.4163 21.6616 70.9808 21.6903 71.3374 22.0352ZM107.171 16.0014C107.171 23.357 100.991 29.3334 93.3844 29.3334C85.7779 29.3334 79.5976 23.357 79.5976 16.0014C79.5976 8.64557 85.7779 2.66911 93.3844 2.66911C100.991 2.66911 107.171 8.64557 107.171 16.0014ZM101.258 16.0014C101.258 11.8062 97.7225 8.38698 93.3844 8.38698C89.0464 8.38698 85.5104 11.8062 85.5104 16.0014C85.5104 20.1962 89.0464 23.6155 93.3844 23.6155C97.7523 23.6155 101.258 20.1962 101.258 16.0014ZM76.6559 17.8688V14.1336C76.6559 13.5877 76.2102 13.1567 75.6457 13.1567H64.4439C63.8793 13.1567 63.4336 13.5877 63.4336 14.1336V17.8688C63.4336 18.415 63.8793 18.8457 64.4439 18.8457H75.6457C76.2102 18.8457 76.6559 18.415 76.6559 17.8688Z" fill="currentColor"/></svg></span>
  </header>

  <main class="content">

    <a class="btn btn--secondary btn--large btn--pill back-btn" href="../../index.html">
      <span class="btn__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Back
    </a>

    <div class="component-header">
      <h1 class="component-header__name">Text Input</h1>
      <p class="component-header__description">All states — Zego Design System</p>
    </div>

    <div class="variants">

      <div class="variant-group">
        <p class="variant-group__label">States</p>
        <div class="field-grid">

          <!-- Default (with value) -->
          <div class="input-group">
            <label class="input-label" for="in-default">Default</label>
            <div class="input-field">
              <input class="input" id="in-default" type="text" value="Input">
            </div>
          </div>

          <!-- Placeholder -->
          <div class="input-group">
            <label class="input-label" for="in-placeholder">Placeholder</label>
            <div class="input-field">
              <input class="input" id="in-placeholder" type="text" placeholder="Input">
            </div>
          </div>

          <!-- Hover (forced) -->
          <div class="input-group">
            <label class="input-label" for="in-hover">Hover</label>
            <div class="input-field input-field--hover">
              <input class="input" id="in-hover" type="text" placeholder="Input">
            </div>
          </div>

          <!-- Focused (forced) with clear button -->
          <div class="input-group">
            <label class="input-label" for="in-focused">Focused</label>
            <div class="input-field input-field--focused">
              <input class="input" id="in-focused" type="text" placeholder="Input">
              <button class="input__clear" type="button" aria-label="Clear">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" fill-opacity="0.3"/><path d="M14.7332 16.3392C14.9277 16.5389 15.2479 16.541 15.445 16.3439L16.1521 15.6369C16.3455 15.4435 16.3476 15.1305 16.1567 14.9345L13.3132 12.0141L16.2433 9.16117C16.443 8.96671 16.4452 8.64648 16.248 8.44937L15.541 7.74233C15.3476 7.54891 15.0346 7.54682 14.8386 7.73764L11.9181 10.5812L9.06528 7.6512C8.87082 7.45148 8.55059 7.44934 8.35349 7.64645L7.64644 8.35349C7.45302 8.54691 7.45093 8.85986 7.64175 9.05585L10.4853 11.9763L7.55531 14.8291C7.35559 15.0236 7.35345 15.3438 7.55056 15.5409L8.2576 16.2479C8.45103 16.4414 8.76397 16.4434 8.95996 16.2526L11.8804 13.4092L14.7332 16.3392Z" fill="currentColor"/></svg>
              </button>
            </div>
          </div>

          <!-- Error with clear button + message -->
          <div class="input-group">
            <label class="input-label" for="in-error">Error</label>
            <div class="input-field input-field--error">
              <input class="input" id="in-error" type="text" value="Input">
              <button class="input__clear" type="button" aria-label="Clear">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" fill-opacity="0.3"/><path d="M14.7332 16.3392C14.9277 16.5389 15.2479 16.541 15.445 16.3439L16.1521 15.6369C16.3455 15.4435 16.3476 15.1305 16.1567 14.9345L13.3132 12.0141L16.2433 9.16117C16.443 8.96671 16.4452 8.64648 16.248 8.44937L15.541 7.74233C15.3476 7.54891 15.0346 7.54682 14.8386 7.73764L11.9181 10.5812L9.06528 7.6512C8.87082 7.45148 8.55059 7.44934 8.35349 7.64645L7.64644 8.35349C7.45302 8.54691 7.45093 8.85986 7.64175 9.05585L10.4853 11.9763L7.55531 14.8291C7.35559 15.0236 7.35345 15.3438 7.55056 15.5409L8.2576 16.2479C8.45103 16.4414 8.76397 16.4434 8.95996 16.2526L11.8804 13.4092L14.7332 16.3392Z" fill="currentColor"/></svg>
              </button>
            </div>
            <p class="input-message input-message--error">Error</p>
          </div>

          <!-- Valid with message -->
          <div class="input-group">
            <label class="input-label" for="in-valid">Valid</label>
            <div class="input-field input-field--valid">
              <input class="input" id="in-valid" type="text" placeholder="Input">
            </div>
            <p class="input-message input-message--valid">Valid Message</p>
          </div>

          <!-- Valid with the trailing tick. An addition, not a 003 variant —
               the Valid state there is a border colour with nothing to say what
               is valid about it. Add .input__status inside the field; nothing
               else changes. See KNOWN-ISSUES 1.8. -->
          <div class="input-group">
            <label class="input-label" for="in-valid-tick">Valid, with tick</label>
            <div class="input-field input-field--valid">
              <input class="input" id="in-valid-tick" type="text" value="SMITH123456A34BT">
              <span class="input__status" role="img" aria-label="Complete">
                <svg viewBox="0 0 24 24" fill="none">
                  <path class="input__status-disc" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1Z"/>
                  <path class="input__status-glyph" fill-rule="evenodd" clip-rule="evenodd" d="M10.4866 13.5576L15.1072 8.9369C15.3025 8.74164 15.6191 8.74164 15.8143 8.9369L16.5214 9.64401C16.7167 9.83927 16.7167 10.1558 16.5214 10.3511L10.8513 16.0213C10.656 16.2166 10.3394 16.2166 10.1442 16.0213L7.60355 13.4807C7.40829 13.2854 7.40829 12.9689 7.60355 12.7736L8.29953 12.0776C8.4948 11.8824 8.81138 11.8824 9.00664 12.0776L10.4866 13.5576Z"/>
                </svg>
              </span>
            </div>
          </div>

          <!-- Date field — readonly, opening a Date Picker. The calendar is
               icons/calendar.svg in a decorative .input__icon slot. -->
          <div class="input-group">
            <label class="input-label" for="in-date">Opens a date picker</label>
            <div class="input-field">
              <input class="input" id="in-date" type="text" readonly placeholder="Select"
                     aria-haspopup="dialog" aria-expanded="false">
              <span class="input__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"> <path fill-rule="evenodd" clip-rule="evenodd" d="M1 5C1 3.89543 1.89543 3 3 3H21C22.1046 3 23 3.89543 23 5V21C23 22.1046 22.1046 23 21 23H3C1.89543 23 1 22.1046 1 21V5ZM21 5L3 5V21H21V5Z" fill="currentColor"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M21 10L2 10L2 8L21 8V10Z" fill="currentColor"/> <path d="M16 1.5C16 1.22386 16.2239 1 16.5 1H17.5C17.7761 1 18 1.22386 18 1.5V4.25C18 4.52614 17.7761 4.75 17.5 4.75H16.5C16.2239 4.75 16 4.52614 16 4.25V1.5Z" fill="currentColor"/> <path d="M6 1.5C6 1.22386 6.22386 1 6.5 1H7.5C7.77614 1 8 1.22386 8 1.5V4.25C8 4.52614 7.77614 4.75 7.5 4.75H6.5C6.22386 4.75 6 4.52614 6 4.25V1.5Z" fill="currentColor"/> </svg></span>
            </div>
          </div>

          <!-- Hint with message -->
          <div class="input-group">
            <label class="input-label" for="in-hint">Hint</label>
            <div class="input-field input-field--hint">
              <input class="input" id="in-hint" type="text" placeholder="Input">
            </div>
            <p class="input-message input-message--hint">Hint Message</p>
          </div>

          <!-- Disabled -->
          <div class="input-group">
            <label class="input-label" for="in-disabled">Disabled</label>
            <div class="input-field input-field--disabled">
              <input class="input" id="in-disabled" type="text" placeholder="Input" disabled>
            </div>
          </div>

        </div>
      </div>

    </div>

  </main>

  <script src="input.js"></script>

</body>
</html>
