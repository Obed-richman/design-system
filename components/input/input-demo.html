<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="input.css">
  <title>Text Input Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 32px;
      color: #27252d;
    }

    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
    section { margin-bottom: 40px; }
    h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Demo dark wrapper — styling only, not component styles */
    .dark-demo {
      background: var(--brand-3-high);
      border-radius: 12px;
      padding: 24px;
    }
    .dark-demo h2 { color: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>

  <h1>Text Input</h1>
  <p class="subtitle">All states — Zego Design System</p>

  <!-- ============================================================
       STATES
  ============================================================ -->
  <section>
    <h2>States</h2>
    <div class="grid">

      <!-- Default (with value) -->
      <div class="input-group">
        <label class="input-label" for="d-default">Default</label>
        <div class="input-field">
          <input class="input" id="d-default" type="text" value="Input">
        </div>
      </div>

      <!-- Placeholder -->
      <div class="input-group">
        <label class="input-label" for="d-placeholder">Placeholder</label>
        <div class="input-field">
          <input class="input" id="d-placeholder" type="text" placeholder="Input">
        </div>
      </div>

      <!-- Hover (forced) -->
      <div class="input-group">
        <label class="input-label" for="d-hover">Hover</label>
        <div class="input-field input-field--hover">
          <input class="input" id="d-hover" type="text" placeholder="Input">
        </div>
      </div>

      <!-- Focused (forced) with clear -->
      <div class="input-group">
        <label class="input-label" for="d-focused">Focused</label>
        <div class="input-field input-field--focused">
          <input class="input" id="d-focused" type="text" placeholder="Input">
          <button class="input__clear" type="button" aria-label="Clear">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" fill-opacity="0.3"/><path d="M14.7332 16.3392C14.9277 16.5389 15.2479 16.541 15.445 16.3439L16.1521 15.6369C16.3455 15.4435 16.3476 15.1305 16.1567 14.9345L13.3132 12.0141L16.2433 9.16117C16.443 8.96671 16.4452 8.64648 16.248 8.44937L15.541 7.74233C15.3476 7.54891 15.0346 7.54682 14.8386 7.73764L11.9181 10.5812L9.06528 7.6512C8.87082 7.45148 8.55059 7.44934 8.35349 7.64645L7.64644 8.35349C7.45302 8.54691 7.45093 8.85986 7.64175 9.05585L10.4853 11.9763L7.55531 14.8291C7.35559 15.0236 7.35345 15.3438 7.55056 15.5409L8.2576 16.2479C8.45103 16.4414 8.76397 16.4434 8.95996 16.2526L11.8804 13.4092L14.7332 16.3392Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div class="input-group">
        <label class="input-label" for="d-error">Error</label>
        <div class="input-field input-field--error">
          <input class="input" id="d-error" type="text" value="Input">
          <button class="input__clear" type="button" aria-label="Clear">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" fill-opacity="0.3"/><path d="M14.7332 16.3392C14.9277 16.5389 15.2479 16.541 15.445 16.3439L16.1521 15.6369C16.3455 15.4435 16.3476 15.1305 16.1567 14.9345L13.3132 12.0141L16.2433 9.16117C16.443 8.96671 16.4452 8.64648 16.248 8.44937L15.541 7.74233C15.3476 7.54891 15.0346 7.54682 14.8386 7.73764L11.9181 10.5812L9.06528 7.6512C8.87082 7.45148 8.55059 7.44934 8.35349 7.64645L7.64644 8.35349C7.45302 8.54691 7.45093 8.85986 7.64175 9.05585L10.4853 11.9763L7.55531 14.8291C7.35559 15.0236 7.35345 15.3438 7.55056 15.5409L8.2576 16.2479C8.45103 16.4414 8.76397 16.4434 8.95996 16.2526L11.8804 13.4092L14.7332 16.3392Z" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="input-message input-message--error">Error</p>
      </div>

      <!-- Valid -->
      <div class="input-group">
        <label class="input-label" for="d-valid">Valid</label>
        <div class="input-field input-field--valid">
          <input class="input" id="d-valid" type="text" placeholder="Input">
        </div>
        <p class="input-message input-message--valid">Valid Message</p>
      </div>

      <!-- Hint -->
      <div class="input-group">
        <label class="input-label" for="d-hint">Hint</label>
        <div class="input-field input-field--hint">
          <input class="input" id="d-hint" type="text" placeholder="Input">
        </div>
        <p class="input-message input-message--hint">Hint Message</p>
      </div>

      <!-- Disabled -->
      <div class="input-group">
        <label class="input-label" for="d-disabled">Disabled</label>
        <div class="input-field input-field--disabled">
          <input class="input" id="d-disabled" type="text" placeholder="Input" disabled>
        </div>
      </div>

    </div>
  </section>

  <!-- ============================================================
       DARK MODE
  ============================================================ -->
  <section>
    <h2>Dark Mode</h2>
    <div class="dark-demo" data-theme="dark">
      <h2>On dark background</h2>
      <div class="grid">

        <div class="input-group">
          <label class="input-label" for="d-dark-default">Default</label>
          <div class="input-field">
            <input class="input" id="d-dark-default" type="text" value="Input">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="d-dark-placeholder">Placeholder</label>
          <div class="input-field">
            <input class="input" id="d-dark-placeholder" type="text" placeholder="Input">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="d-dark-focused">Focused</label>
          <div class="input-field input-field--focused">
            <input class="input" id="d-dark-focused" type="text" placeholder="Input">
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="input.js"></script>

</body>
</html>
