<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="toggle.css">
  <title>Toggle Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f8f8; margin: 0; padding: 32px; color: #27252d; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
    section { margin-bottom: 40px; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 32px; margin-bottom: 16px; }
    .label { font-size: 11px; color: #A0A0A0; width: 96px; flex-shrink: 0; }
    .dark-demo { background: var(--brand-3-high); border-radius: 12px; padding: 24px; }
    .dark-demo h2 { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <h1>Toggle</h1>
  <p class="subtitle">Style × State × Size — Zego Design System</p>

  <section>
    <h2>OS — Large</h2>
    <div class="row"><span class="label">Inactive / Active</span>
      <label class="toggle"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
      <label class="toggle"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
    </div>
    <div class="row"><span class="label">Disabled</span>
      <label class="toggle toggle--disabled"><input class="toggle__input" type="checkbox" role="switch" disabled><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
      <label class="toggle toggle--disabled"><input class="toggle__input" type="checkbox" role="switch" checked disabled><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
    </div>
  </section>

  <section>
    <h2>OS — Small (16)</h2>
    <div class="row"><span class="label">Inactive / Active</span>
      <label class="toggle toggle--16"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
      <label class="toggle toggle--16"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
    </div>
  </section>

  <section>
    <h2>Web — Large</h2>
    <div class="row"><span class="label">Inactive / Active</span>
      <label class="toggle toggle--web"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
      <label class="toggle toggle--web"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
    </div>
  </section>

  <section>
    <h2>Dark Mode</h2>
    <div class="dark-demo" data-theme="dark">
      <h2>On dark background</h2>
      <div class="row">
        <label class="toggle"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
        <label class="toggle"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
        <label class="toggle toggle--web"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
      </div>
    </div>
  </section>

</body>
</html>
