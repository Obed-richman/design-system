<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Item — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="track-item.css">
  <style>body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); display: flex; flex-direction: column; gap: 20px; }
    .track { width: 240px; }</style>
</head>
<body>

  <div style="display:flex; gap:12px; align-items:center">
    <span class="track-item track-item--lapsed"></span>
    <span class="track-item"></span>
  </div>

  <div class="track">
    <span class="track-item track-item--lapsed"></span>
    <span class="track-item track-item--lapsed"></span>
    <span class="track-item track-item--lapsed"></span>
    <span class="track-item track-item--lapsed"></span>
    <span class="track-item"></span>
    <span class="track-item"></span>
    <span class="track-item"></span>
  </div>

</body>
</html>
