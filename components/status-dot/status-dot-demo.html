<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Dot — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="status-dot.css">
  <style>body { margin: 0; padding: 24px; background: var(--surface-tertiary); font-family: var(--font-family-base); display: flex; align-items: center; gap: 20px; }</style>
</head>
<body>
  <span class="status-dot status-dot--positive" role="img" aria-label="Positive"></span>
  <span class="status-dot status-dot--warning" role="img" aria-label="Warning"></span>
  <span class="status-dot status-dot--negative" role="img" aria-label="Negative"></span>
  <span class="status-dot status-dot--information" role="img" aria-label="Information"></span>
  <span class="status-dot status-dot--rewards" role="img" aria-label="Rewards"></span>
  <span class="status-dot status-dot--disabled" role="img" aria-label="Disabled"></span>
</body>
</html>
