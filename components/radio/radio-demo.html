<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="radio.css">
  <title>Radio Button Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 32px;
      color: #27252d;
    }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: #737373; font-size: 14px; margin: 0 0 40px; }
    section { margin-bottom: 40px; }
    h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #A0A0A0; margin: 0 0 16px;
    }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 28px; margin-bottom: 16px; }
    .label { font-size: 11px; color: #A0A0A0; width: 72px; flex-shrink: 0; }
    .dark-demo { background: var(--brand-3-high); border-radius: 12px; padding: 24px; }
    .dark-demo h2 { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <h1>Radio Button</h1>
  <p class="subtitle">Type × State × Size — Zego Design System</p>

  <!-- RADIO (dot) -->
  <section>
    <h2>Radio</h2>
    <div class="row"><span class="label">Default</span>
      <label class="radio"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Hover</span>
      <label class="radio radio--hover"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--hover"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Focused</span>
      <label class="radio radio--focused"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--focused"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Error</span>
      <label class="radio radio--error"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--error"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Disabled</span>
      <label class="radio radio--disabled"><input class="radio__input" type="radio" disabled><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--disabled"><input class="radio__input" type="radio" checked disabled><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Size 16</span>
      <label class="radio radio--16"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--16"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
    </div>
  </section>

  <!-- CHECK CIRCLE -->
  <section>
    <h2>Check circle</h2>
    <div class="row"><span class="label">Default</span>
      <label class="radio radio--check"><input class="radio__input" type="radio"><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Unchecked</span></label>
      <label class="radio radio--check"><input class="radio__input" type="radio" checked><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Error</span>
      <label class="radio radio--check radio--error"><input class="radio__input" type="radio" checked><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Disabled</span>
      <label class="radio radio--check radio--disabled"><input class="radio__input" type="radio" checked disabled><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Checked</span></label>
    </div>
    <div class="row"><span class="label">Size 16</span>
      <label class="radio radio--check radio--16"><input class="radio__input" type="radio" checked><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Checked</span></label>
    </div>
  </section>

  <!-- DARK MODE -->
  <section>
    <h2>Dark Mode</h2>
    <div class="dark-demo" data-theme="dark">
      <h2>On dark background</h2>
      <div class="row">
        <label class="radio"><input class="radio__input" type="radio"><span class="radio__control"></span><span class="radio__label">Default</span></label>
        <label class="radio"><input class="radio__input" type="radio" checked><span class="radio__control"></span><span class="radio__label">Checked</span></label>
        <label class="radio radio--check"><input class="radio__input" type="radio" checked><span class="radio__control"><svg class="radio__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="radio__label">Check</span></label>
      </div>
    </div>
  </section>

</body>
</html>
