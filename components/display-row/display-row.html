<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Row — Design System</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../../tokens/typography.css">
  <link rel="stylesheet" href="../radio/radio.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="display-row.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background-page); color: var(--text-primary); font-family: var(--font-family-base); min-height: 100vh; }
    .header { width: 100%; height: 104px; background: var(--brand-3-high); display: flex; align-items: center; justify-content: center; }
    .header__logo { display: inline-flex; align-items: center; color: var(--colour-white); }
    .header__logo svg { width: 110px; height: 32px; display: block; }
    .content { max-width: 876px; margin: 0 auto; padding: 24px 24px 48px; }
    .back-btn { margin-bottom: 24px; }
    .component-header { margin-bottom: 24px; }
    .component-header__name { font-family: var(--font-family-base); font-weight: var(--font-weight-bold); font-size: var(--font-size-title-4); line-height: var(--line-height-title-4); color: var(--text-primary); margin: 0; }
    .component-header__description { font-family: var(--font-family-base); font-weight: var(--font-weight-regular); font-size: var(--font-size-body-2); line-height: var(--line-height-body-2); color: var(--colour-grey-60); margin: 4px 0 0; }
    .variants { background: var(--colour-white); border-radius: 16px; border: 1px solid var(--border-primary); padding: 24px; }
    .list { max-width: 420px; }
  </style>
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>
</head>
<body>

  <header class="header">

64557 85.7779 2.66911 93.3844 2.66911C100.991 2.66911 107.171 8.64557 107.171 16.0014ZM101.258 16.0014C101.258 11.8062 97.7225 8.38698 93.3844 8.38698C89.0464 8.38698 85.5104 11.8062 85.5104 16.0014C85.5104 20.1962 89.0464 23.6155 93.3844 23.6155C97.7523 23.6155 101.258 20.1962 101.258 16.0014ZM76.6559 17.8688V14.1336C76.6559 13.5877 76.2102 13.1567 75.6457 13.1567H64.4439C63.8793 13.1567 63.4336 13.5877 63.4336 14.1336V17.8688C63.4336 18.415 63.8793 18.8457 64.4439 18.8457H75.6457C76.2102 18.8457 76.6559 18.415 76.6559 17.8688Z" fill="currentColor"/></svg></span>
  </header>

  <main class="content">

    <a class="btn btn--secondary btn--large btn--pill back-btn" href="../../index.html">
      <span class="btn__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Back
    </a>

    <div class="component-header">
      <h1 class="component-header__name">Display Row</h1>
      <p class="component-header__description">Configurable list row — Zego Design System</p>
    </div>

    <div class="variants">
      <div class="list" id="list"></div>
    </div>

  </main>

  <script>
    var TICK = '<span class="display-row__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.4866 13.5577L15.1072 8.93704C15.3025 8.74178 15.6191 8.74178 15.8143 8.93704L16.5214 9.64415C16.7167 9.83941 16.7167 10.156 16.5214 10.3513L10.8513 16.0214C10.656 16.2167 10.3394 16.2167 10.1442 16.0214L7.60355 13.4808C7.40829 13.2856 7.40829 12.969 7.60355 12.7737L8.29953 12.0778C8.4948 11.8825 8.81138 11.8825 9.00664 12.0778L10.4866 13.5577Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3ZM1 12C1 5.92487 5.92487 1 12 1C18.0751 1 23 5.92487 23 12C23 18.0751 18.0751 23 12 23C5.92487 23 1 18.0751 1 12Z" fill="currentColor"/></svg></span>';
    var CHEVRON = '<span class="display-row__trailing"><svg class="display-row__chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M17.0727 12.6309L8.31543 22.2278C8.1293 22.4318 7.81305 22.4463 7.60907 22.2601L6.87038 21.5861C6.6664 21.4 6.65193 21.0837 6.83806 20.8797L15.011 11.9231L6.83806 2.96651C6.65193 2.76253 6.6664 2.44628 6.87038 2.26014L7.60907 1.58609C7.81305 1.39996 8.1293 1.41442 8.31543 1.61841L17.0727 11.2154C17.4385 11.6163 17.4385 12.2299 17.0727 12.6309Z" fill="currentColor"/></svg></span>';
    var RADIO = '<span class="display-row__trailing"><input class="radio__input" type="radio" name="dr"><span class="radio__control"></span></span>';
    var BUTTON = '<span class="display-row__trailing"><button class="btn btn--primary btn--pill" type="button">Button<span class="btn__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.8984 3.58972C10.703 3.39458 10.703 3.07821 10.8984 2.88308L11.6361 2.14635C11.8315 1.95122 12.1483 1.95122 12.3437 2.14635L21.8081 11.5982C21.8204 11.6105 21.832 11.6233 21.8428 11.6366L21.8537 11.6475C22.0491 11.8426 22.0491 12.159 21.8537 12.3541L12.3418 21.8534C12.1464 22.0485 11.8296 22.0485 11.6342 21.8534L10.8965 21.1166C10.7011 20.9215 10.7011 20.6051 10.8965 20.41L18.3163 13H2.5C2.22386 13 2 12.7762 2 12.5V11.5C2 11.2239 2.22386 11 2.5 11H18.3186L10.8984 3.58972Z" fill="currentColor"/></svg></span></button></span>';

    function row(o) {
      o = o || {};
      var main = '<div class="display-row__main"><p class="display-row__label">Delivery</p>'
        + (o.support ? '<p class="display-row__support">Paragraph</p>' : '') + '</div>';
      var value = o.value ? '<p class="display-row__value">Delivery</p>' : '';
      var trailing = o.chevron ? CHEVRON : o.radio ? RADIO : o.button ? BUTTON : '';
      return '<div class="display-row">' + (o.icon ? TICK : '') + main + value + trailing + '</div>';
    }

    document.getElementById('list').innerHTML = [
      row({}),
      row({ button: true }),
      row({ support: true }),
      row({ value: true }),
      row({ radio: true }),
      row({ value: true, support: true }),
      row({ icon: true }),
      row({ icon: true, button: true }),
      row({ icon: true, support: true }),
      row({ chevron: true }),
      row({ value: true, chevron: true }),
      row({ icon: true, chevron: true, value: true, support: true }),
      row({ icon: true, radio: true, value: true, support: true })
    ].join('');
  </script>

</body>
</html>
