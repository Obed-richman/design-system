<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Item — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../checkbox/checkbox.css">
  <link rel="stylesheet" href="../toggle/toggle.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="../status-label/status-label.css">
  <link rel="stylesheet" href="table-item.css">
  <style>
    body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); }
    .matrix { display: grid; grid-template-columns: max-content 200px 200px; gap: 4px 24px; align-items: center; }
    .matrix > .lbl { font-size: 13px; color: var(--colour-grey-60); }
    .matrix > .col-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--colour-grey-60); }
    .cell { border-bottom: 1px solid var(--border-primary); }
  </style>
</head>
<body>
  <div class="matrix">
    <span></span><span class="col-head">Large</span><span class="col-head">Small</span>

    <span class="lbl">Title</span>
    <div class="table-item table-item--title cell">Title</div>
    <div class="table-item table-item--small table-item--title cell">Title</div>

    <span class="lbl">Text</span>
    <div class="table-item table-item--text cell">Text</div>
    <div class="table-item table-item--small table-item--text cell">Text</div>

    <span class="lbl">Action</span>
    <div class="table-item table-item--action cell"><a class="table-item__link" href="#">Text</a></div>
    <div class="table-item table-item--small table-item--action cell"><a class="table-item__link" href="#">Text</a></div>

    <span class="lbl">Tick</span>
    <div class="table-item table-item--tick cell"><span class="table-item__badge table-item__badge--tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="table-item table-item--small table-item--tick cell"><span class="table-item__badge table-item__badge--tick"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>

    <span class="lbl">Cross</span>
    <div class="table-item table-item--cross cell"><span class="table-item__badge table-item__badge--cross"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span></div>
    <div class="table-item table-item--small table-item--cross cell"><span class="table-item__badge table-item__badge--cross"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span></div>

    <span class="lbl">Checkbox</span>
    <div class="table-item cell"><label class="checkbox"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label></div>
    <div class="table-item table-item--small cell"><label class="checkbox"><input class="checkbox__input" type="checkbox"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label></div>

    <span class="lbl">Toggle</span>
    <div class="table-item cell"><label class="toggle"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label></div>
    <div class="table-item table-item--small cell"><label class="toggle"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label></div>

    <span class="lbl">Button</span>
    <div class="table-item cell"><button class="btn btn--secondary btn--small btn--rounded" type="button">Button</button></div>
    <div class="table-item table-item--small cell"><button class="btn btn--secondary btn--small btn--rounded" type="button">Button</button></div>

    <span class="lbl">Label</span>
    <div class="table-item cell"><span class="status-label status-label--rounded status-label--information">Information</span></div>
    <div class="table-item table-item--small cell"><span class="status-label status-label--rounded status-label--information">Information</span></div>

    <span class="lbl">Icon</span>
    <div class="table-item table-item--icon cell"><span class="table-item__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.0634 11.4771L13.5634 7.22714L14.9366 5.77311L19.4366 10.0231L18.0634 11.4771Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M19 22.5001C19 22.7763 18.7761 23.0001 18.5 23.0001H13.5C13.2238 23.0001 13 22.7763 13 22.5001V21.5001C13 21.224 13.2238 21.0001 13.5 21.0001H18.5C18.7761 21.0001 19 21.224 19 21.5001V22.5001Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M23 22.5001C23 22.7763 22.7761 23.0001 22.5 23.0001H21.5C21.2238 23.0001 21 22.7763 21 22.5001V21.5001C21 21.224 21.2238 21.0001 21.5 21.0001H22.5C22.7761 21.0001 23 21.224 23 21.5001V22.5001Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M16.5675 1.64432C17.3536 0.857233 18.6308 0.862793 19.41 1.65669L22.3711 4.67371C23.1397 5.45682 23.1338 6.71295 22.3579 7.48884L8.32846 21.5184C8.12006 21.7268 7.85487 21.8692 7.56602 21.9278L2.86187 22.8821C1.81029 23.0954 0.881329 22.1678 1.09318 21.1159L2.0072 16.5776C2.06547 16.2883 2.20778 16.0226 2.41632 15.8138L16.5675 1.64432ZM20.9437 6.07463L17.9826 3.05762L3.93805 17.1204L3.20255 20.7722L7.02076 19.9977L20.9437 6.07463Z" fill="currentColor"/></svg></span></div>
    <div class="table-item table-item--small table-item--icon cell"><span class="table-item__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.0634 11.4771L13.5634 7.22714L14.9366 5.77311L19.4366 10.0231L18.0634 11.4771Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M19 22.5001C19 22.7763 18.7761 23.0001 18.5 23.0001H13.5C13.2238 23.0001 13 22.7763 13 22.5001V21.5001C13 21.224 13.2238 21.0001 13.5 21.0001H18.5C18.7761 21.0001 19 21.224 19 21.5001V22.5001Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M23 22.5001C23 22.7763 22.7761 23.0001 22.5 23.0001H21.5C21.2238 23.0001 21 22.7763 21 22.5001V21.5001C21 21.224 21.2238 21.0001 21.5 21.0001H22.5C22.7761 21.0001 23 21.224 23 21.5001V22.5001Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M16.5675 1.64432C17.3536 0.857233 18.6308 0.862793 19.41 1.65669L22.3711 4.67371C23.1397 5.45682 23.1338 6.71295 22.3579 7.48884L8.32846 21.5184C8.12006 21.7268 7.85487 21.8692 7.56602 21.9278L2.86187 22.8821C1.81029 23.0954 0.881329 22.1678 1.09318 21.1159L2.0072 16.5776C2.06547 16.2883 2.20778 16.0226 2.41632 15.8138L16.5675 1.64432ZM20.9437 6.07463L17.9826 3.05762L3.93805 17.1204L3.20255 20.7722L7.02076 19.9977L20.9437 6.07463Z" fill="currentColor"/></svg></span></div>

  </div>
</body>
</html>
