<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination Indicator — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="pagination.css">
  <style>
    body { margin: 0; padding: 24px; background: var(--background-page); font-family: var(--font-family-base); display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  </style>
</head>
<body>

  <div class="pagination" role="tablist" aria-label="Progress">
    <span class="pagination__dot pagination__dot--active" role="tab" aria-selected="true"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
  </div>

  <div class="pagination" role="tablist" aria-label="Progress">
    <span class="pagination__dot pagination__dot--active" role="tab" aria-selected="true"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
  </div>

  <div class="pagination" role="tablist" aria-label="Progress">
    <span class="pagination__dot pagination__dot--active" role="tab" aria-selected="true"></span>
    <span class="pagination__dot" role="tab" aria-selected="false"></span>
  </div>

</body>
</html>
