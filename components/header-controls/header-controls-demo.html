<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Controls — Demo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../input/input.css">
  <link rel="stylesheet" href="../search/search.css">
  <link rel="stylesheet" href="../button/button.css">
  <link rel="stylesheet" href="../control-set/control-set.css">
  <link rel="stylesheet" href="../tab/tab.css">
  <link rel="stylesheet" href="../tab-bar/tab-bar.css">
  <link rel="stylesheet" href="header-controls.css">
  <style>body { margin: 0; background: var(--background-page); font-family: var(--font-family-base); }</style>
  <script src="../tab-bar/tab-bar.js" defer></script>
</head>
<body>
  <div class="header-controls">

    <!-- Row 1 — Header bar -->
    <div class="header-controls__bar">
      <div class="input-field header-controls__search">
        <input class="input" type="search" placeholder="Search across all sections">
        <span class="search__glyph"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.0867 1C5.06825 1 1 5.06825 1 10.0867C1 15.1051 5.06825 19.1734 10.0867 19.1734C12.2322 19.1734 14.204 18.4298 15.7585 17.1863L21.4243 22.8521C21.6214 23.0493 21.9411 23.0493 22.1382 22.8521L22.8521 22.1382C23.0493 21.9411 23.0493 21.6214 22.8521 21.4243L17.1863 15.7585C18.4298 14.204 19.1734 12.2322 19.1734 10.0867C19.1734 5.06825 15.1051 1 10.0867 1ZM3.01926 10.0867C3.01926 6.18346 6.18346 3.01926 10.0867 3.01926C13.9899 3.01926 17.1541 6.18346 17.1541 10.0867C17.1541 13.9899 13.9899 17.1541 10.0867 17.1541C6.18346 17.1541 3.01926 13.9899 3.01926 10.0867Z" fill="currentColor"/></svg></span>
      </div>
      <div class="header-controls__actions">
        <span class="header-controls__notify" data-unread="true">
          <button class="btn btn--secondary btn--fab" type="button" aria-label="Notifications">
            <span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.0131 4.02325C8.7017 4.02325 6.01306 6.71502 6.01306 10.0407C6.01306 10.1552 6.01624 10.2689 6.0225 10.3816L6.02988 10.5146L6.01306 10.5938V13.0712L5.18121 16H18.8851C18.8783 15.9746 18.8711 15.9482 18.8633 15.9209C18.7831 15.6371 18.6733 15.3207 18.5521 14.9792C18.539 14.9423 18.5257 14.9049 18.5123 14.8672C18.4069 14.5706 18.2945 14.2545 18.207 13.9678C18.1157 13.6684 18.0131 13.2841 18.0131 12.932V10.8572C18.0126 10.8535 18.0122 10.8502 18.0118 10.8473C18.0097 10.8295 18.0085 10.8149 18.0077 10.8058C18.0063 10.7878 18.0056 10.7726 18.0052 10.7639C18.0047 10.754 18.0044 10.7447 18.0042 10.7368C18.0034 10.7073 18.0029 10.6689 18.0026 10.6237C18.0023 10.5765 18.0021 10.5152 18.0021 10.4371V10.4093L18.0036 10.3816C18.0099 10.2689 18.0131 10.1552 18.0131 10.0407C18.0131 6.71502 15.3244 4.02325 12.0131 4.02325ZM20.0123 10.578C20.0123 10.5775 20.0123 10.5774 20.0123 10.578V10.578ZM20.0046 10.4125C20.0102 10.2892 20.0131 10.1653 20.0131 10.0407C20.0131 5.61516 16.4337 2.02325 12.0131 2.02325C7.59243 2.02325 4.01306 5.61516 4.01306 10.0407C4.01306 10.1582 4.01559 10.2751 4.02059 10.3914C4.0156 10.4411 4.01306 10.4914 4.01306 10.542V12.7927L3 16.3595V16.4987C3 17.3255 3.66922 18 4.5 18H19.4761C20.3069 18 20.9761 17.3255 20.9761 16.4987C20.9761 16.1201 20.8844 15.7182 20.788 15.3771C20.6876 15.0219 20.5567 14.6479 20.4371 14.3106C20.4237 14.2728 20.4104 14.2356 20.3974 14.1989C20.2891 13.8942 20.1932 13.6243 20.12 13.3843C20.0798 13.2523 20.0511 13.1443 20.0331 13.0584C20.014 12.9675 20.0131 12.9304 20.0131 12.932V10.542C20.0131 10.5397 20.0131 10.5319 20.0129 10.5222C20.0128 10.5184 20.0126 10.505 20.0117 10.4883C20.0114 10.4839 20.0108 10.474 20.0104 10.4684C20.0099 10.461 20.0083 10.4435 20.0073 10.4334C20.0067 10.4286 20.0058 10.4211 20.0046 10.4125ZM19.2836 9.77135C19.281 9.77046 19.2784 9.76959 19.2759 9.76877C19.2596 9.76503 19.2402 9.76149 19.2189 9.75823C19.2407 9.76226 19.2622 9.76664 19.2836 9.77135Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M14.988 21.5C14.988 21.7761 14.7642 22 14.488 22L9.48804 22C9.21189 22 8.98804 21.7761 8.98804 21.5L8.98804 20.5C8.98804 20.2239 9.21189 20 9.48804 20L14.488 20C14.7642 20 14.988 20.2239 14.988 20.5L14.988 21.5Z" fill="currentColor"/></svg></span>
          </button>
        </span>
      </div>
    </div>

    <!-- Row 2 — Title bar -->
    <div class="header-controls__title-bar">
      <div class="header-controls__title-left">
        <button class="btn btn--secondary btn--small btn--rounded" type="button">
          <span class="btn__icon"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 12l-4-4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Back
        </button>
        <h1 class="header-controls__title">Title</h1>
        <nav class="header-controls__breadcrumb" aria-label="Breadcrumb">
          <a class="header-controls__crumb" href="#">Home</a>
          <a class="header-controls__crumb" href="#">Step</a>
          <span class="header-controls__crumb" aria-current="page">Step</span>
        </nav>
      </div>
      <div class="header-controls__title-actions">
        <button class="btn btn--secondary btn--small btn--rounded" type="button">
          <span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          Button
        </button>
        <button class="btn btn--primary btn--small btn--rounded" type="button">
          <span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          Button
        </button>
      </div>
    </div>

    <!-- Row 3 — Tabs control -->
    <div class="control-set control-set--tabs">
      <div class="tabs" role="tablist" aria-label="Views">
        <button class="tab-item tab-item--active" role="tab" aria-selected="true">Item</button>
        <button class="tab-item" role="tab" aria-selected="false">Item</button>
        <button class="tab-item" role="tab" aria-selected="false">Item</button>
        <button class="tab-item" role="tab" aria-selected="false">Item</button>
        <button class="tab-item" role="tab" aria-selected="false">Item</button>
      </div>
    </div>

  </div>
</body>
</html>
