<!-- Tab Bar — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="tabs" role="tablist" id="bar">
    <button class="tab-item tab-item--active" role="tab" aria-selected="true">Overview</button>
    <button class="tab-item" role="tab" aria-selected="false">Cover</button>
    <button class="tab-item" role="tab" aria-selected="false">Documents</button>
  </div>
  <p class="panel" id="panel">Overview panel</p>

  
  <div class="tabs" role="tablist">
    <button class="tab-item tab-item--active" role="tab" aria-selected="true">One</button>
    <button class="tab-item" role="tab" aria-selected="false">Two</button>
    <button class="tab-item" role="tab" aria-selected="false">Three</button>
    <button class="tab-item" role="tab" aria-selected="false">Four</button>
    <button class="tab-item" role="tab" aria-selected="false">Five</button>
  </div>
