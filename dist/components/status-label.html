     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="row">
  <span class="status-label status-label--information">Information</span>
  <span class="status-label status-label--success">Success</span>
  <span class="status-label status-label--warning">Warning</span>
  <span class="status-label status-label--error">Error</span>
  <span class="status-label status-label--inactive">Inactive</span>
  <span class="status-label status-label--disabled">Disabled</span>
</div>

  

<div class="row">
  <span class="status-label status-label--rounded status-label--information">Information</span>
  <span class="status-label status-label--rounded status-label--success">Success</span>

<div class="row">

</div>

  

<div class="row">
  <span class="status-label status-label--success"><span class="status-label__icon"><svg viewBox="0 0 8 8" fill="none" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg></span>Active</span>
  <span class="status-label status-label--warning"><span class="status-label__icon"><svg viewBox="0 0 8 8" fill="none" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg></span>Pending</span>
  <span class="status-label status-label--error"><span class="status-label__icon"><svg viewBox="0 0 8 8" fill="none" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg></span>Failed</span>
</div>
