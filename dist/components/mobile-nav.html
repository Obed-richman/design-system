<!-- Mobile Nav — Zego Design System

          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.25" stroke="currentColor" stroke-width="2"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

<!-- Stacked: modal / web-view header over a scrim -->
<div class="scrim">
  <div class="mobile-stack">
    <div class="mobile-stack__grabber"></div>
    <div class="mobile-stack__sheet">
      <button class="mobile-stack__close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>
