<!-- Optional Input — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<section>
  
  <div class="row">
    
    <div class="optional-input">
      <div class="input-group">
        <span class="input-label input-label--title" id="d-no-label">When was the vehicle purchased?</span>
        <div role="group" aria-labelledby="d-no-label" class="input-field input-date"
             data-date-max="today"
             data-date-error="The purchase date can&#39;t be in the future.">
          <input class="input input-date__part input-date__part--month" id="d-no-month"
                 type="text" placeholder="MM" aria-label="Purchase month"
                 inputmode="numeric" maxlength="2" autocomplete="off">
          <span class="input-date__separator" aria-hidden="true">/</span>
          <input class="input input-date__part input-date__part--year" id="d-no-year"
                 type="text" placeholder="YYYY" aria-label="Purchase year"
                 inputmode="numeric" maxlength="4" autocomplete="off">
        </div>
      </div>
      <div class="divider-text"><span class="divider-text__label">or</span></div>
      <label class="checkbox">
        <input class="checkbox__input" type="checkbox">
        <span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="checkbox__label">The vehicle has not been purchased yet.</span>
      </label>
    </div>
  </div>
  <div class="row">
    
    <div class="optional-input">
      <div class="input-group">
        <span class="input-label input-label--title" id="d-yes-label">When was the vehicle purchased?</span>
        <div role="group" aria-labelledby="d-yes-label" class="input-field input-date input-field--disabled"
             data-date-max="today"
             data-date-error="The purchase date can&#39;t be in the future.">
          <input class="input input-date__part input-date__part--month" id="d-yes-month"
                 type="text" placeholder="MM" aria-label="Purchase month"
                 inputmode="numeric" maxlength="2" autocomplete="off" disabled>
          <span class="input-date__separator" aria-hidden="true">/</span>
          <input class="input input-date__part input-date__part--year" id="d-yes-year"
                 type="text" placeholder="YYYY" aria-label="Purchase year"
                 inputmode="numeric" maxlength="4" autocomplete="off" disabled>
        </div>
      </div>
      <div class="divider-text"><span class="divider-text__label">or</span></div>
      <label class="checkbox">
        <input class="checkbox__input" type="checkbox" checked>
        <span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="checkbox__label">The vehicle has not been purchased yet.</span>
      </label>
    </div>
  </div>
</section>
