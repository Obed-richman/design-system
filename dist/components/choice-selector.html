<!-- Choice Selector — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<fieldset class="choice-selector">
  <div class="choice-selector__header">
    <p class="choice-selector__title">Do you have any named drivers?</p>
    <p class="choice-selector__paragraph">Select one option to continue.</p>
  </div>
  <div class="choice-selector__options">
    <label class="text-icon-item text-icon-item--inactive"><span class="text-icon-item__text"><span class="text-icon-item__label">Yes</span></span><input class="radio__input" type="radio" name="yn"><span class="radio__control"></span></label>
    <label class="text-icon-item text-icon-item--inactive"><span class="text-icon-item__text"><span class="text-icon-item__label">No</span></span><input class="radio__input" type="radio" name="yn"><span class="radio__control"></span></label>
  </div>
</fieldset>

  

<fieldset class="choice-selector">
  <div class="choice-selector__header">
    <p class="choice-selector__title">Cover level</p>
    <p class="choice-selector__paragraph">Choose the level that suits you.</p>
  </div>
  <div class="choice-selector__options">
    <label class="text-icon-item text-icon-item--inactive"><span class="text-icon-item__text"><span class="text-icon-item__label">Basic</span></span><input class="radio__input" type="radio" name="cover"><span class="radio__control"></span></label>
    <label class="text-icon-item text-icon-item--inactive"><span class="text-icon-item__text"><span class="text-icon-item__label">Plus</span></span><input class="radio__input" type="radio" name="cover" checked><span class="radio__control"></span></label>
    <label class="text-icon-item text-icon-item--inactive"><span class="text-icon-item__text"><span class="text-icon-item__label">Premium</span></span><input class="radio__input" type="radio" name="cover"><span class="radio__control"></span></label>
  </div>
  <p class="choice-selector__message">You can change this later in settings.</p>
</fieldset>
