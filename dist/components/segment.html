<!-- Segment — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="segment segment--40" role="tablist" aria-label="Billing period">
  <button class="segment__item segment__item--active" role="tab" aria-selected="true">Monthly</button>
  <button class="segment__item" role="tab" aria-selected="false">Annual</button>
</div>

  

<div class="segment segment--40" role="tablist" aria-label="View">
  <button class="segment__item segment__item--active" role="tab" aria-selected="true">Day</button>
  <button class="segment__item" role="tab" aria-selected="false">Week</button>
  <button class="segment__item" role="tab" aria-selected="false">Month</button>
</div>

  

<div class="segment segment--40 segment--fill" role="tablist" aria-label="Cover" style="max-width:420px">
  <button class="segment__item segment__item--active" role="tab" aria-selected="true">Comprehensive</button>
  <button class="segment__item" role="tab" aria-selected="false">Third party</button>
</div>
