<!-- Notice Toggle — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="stack">
  <div class="notice-toggle notice-toggle--positive">
    <div class="notice-toggle__content">
      <p class="notice-toggle__title">Auto renewal is turned on</p>
      <p class="notice-toggle__text">Your policy will automatically renew on 14/07/2026, so you do not need to do anything.</p>
    </div>
    <label class="toggle notice-toggle__switch"><input class="toggle__input" type="checkbox" role="switch" checked><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
  </div>

  <div class="notice-toggle notice-toggle--information">
    <div class="notice-toggle__content">
      <p class="notice-toggle__title">Paperless documents</p>
      <p class="notice-toggle__text">We'll email your policy documents instead of posting them.</p>
    </div>
    <label class="toggle notice-toggle__switch"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
  </div>

  <div class="notice-toggle">
    <div class="notice-toggle__content">
      <p class="notice-toggle__title">Marketing emails</p>
      <p class="notice-toggle__text">Get product updates and the occasional offer. You can opt out any time.</p>
    </div>
    <label class="toggle notice-toggle__switch"><input class="toggle__input" type="checkbox" role="switch"><span class="toggle__track"><span class="toggle__thumb"></span></span></label>
  </div>
</div>
