<!-- Modal — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="card">
  <p class="cap">Live &mdash; backdrop, Escape and any [data-modal-close] all dismiss it</p>
  <div class="row">
    <button class="btn btn--secondary btn--pill" type="button" data-modal-open="discard">Discard confirmation</button>
  </div>
</div>

<div class="modal overlay overlay--darker" id="discard" hidden>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="discard-title">
    <button class="modal__close" type="button" aria-label="Close" data-modal-close><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.1036 3.10356C19.9083 2.90829 19.5917 2.90829 19.3964 3.10355L11.9142 10.5858L4.51777 3.18934C4.3225 2.99408 4.00592 2.99408 3.81066 3.18934L3.10355 3.89645C2.90829 4.09171 2.90829 4.40829 3.10355 4.60355L10.5 12L3.13299 19.367C2.93773 19.5623 2.93773 19.8789 3.13299 20.0741L3.8401 20.7812C4.03536 20.9765 4.35194 20.9765 4.5472 20.7812L11.9142 13.4142L19.367 20.867C19.5623 21.0623 19.8789 21.0623 20.0741 20.867L20.7812 20.1599C20.9765 19.9646 20.9765 19.6481 20.7812 19.4528L13.3284 12L20.8107 4.51777C21.0059 4.32251 21.0059 4.00592 20.8107 3.81066L20.1036 3.10356Z" fill="currentColor"/></svg></button>
    
    <p class="modal__body">Changing your answer to &#39;No&#39; will discard the details you&#39;ve added, you&#39;ll need to re-enter them if you change your mind.</p>
    <div class="modal__actions">
      <button class="btn btn--primary btn--destructive btn--pill btn--block" type="button" data-modal-close>Discard</button>
      <button class="btn btn--secondary btn--pill btn--block" type="button" data-modal-close>Cancel</button>
    </div>
  </div>
</div>
