<!-- Accordion — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="stack">
  <details class="accordion">
    <summary class="accordion__header">
      <span class="accordion__title">Your car</span>
      <svg class="accordion__chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div class="accordion__panel">
      <div class="accordion__action"><button class="btn btn--secondary btn--pill" type="button">Edit details</button></div>
      <p class="accordion__info">Registered keeper and vehicle details.</p>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Make &amp; model</p></div><p class="display-row__value">Ford Focus</p></div>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Registration</p></div><p class="display-row__value">SH48 HSA</p></div>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Year of manufacture</p></div><p class="display-row__value">2019</p></div>
    </div>
  </details>

  <details class="accordion" open>
    <summary class="accordion__header">
      <span class="accordion__title">Your cover</span>
      <svg class="accordion__chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div class="accordion__panel">
      <div class="accordion__action"><button class="btn btn--secondary btn--pill" type="button">Edit details</button></div>
      <p class="accordion__info">What's included in your policy.</p>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Comprehensive cover</p></div><p class="display-row__value">Included</p></div>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Breakdown cover</p></div><p class="display-row__value">£24</p></div>
      <div class="display-row"><div class="display-row__main"><p class="display-row__label">Courtesy car</p></div><p class="display-row__value">Included</p></div>
      <div class="alert alert--information alert--bordered">
        <span class="alert__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7C11.3096 7 10.75 7.55964 10.75 8.25C10.75 8.94036 11.3096 9.5 12 9.5C12.6904 9.5 13.25 8.94036 13.25 8.25C13.25 7.55964 12.6904 7 12 7Z" fill="currentColor"/><path d="M13 11.5C13 11.2239 12.7761 11 12.5 11H11.5C11.2239 11 11 11.2239 11 11.5L11 16.5C11 16.7761 11.2239 17 11.5 17L12.5 17C12.7761 17 13 16.7761 13 16.5L13 11.5Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1ZM3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12Z" fill="currentColor"/></svg></span>
        <div class="alert__content"><p class="alert__description">Adding a young driver may increase your excess.</p></div>
      </div>
    </div>
  </details>
</div>
