<!-- Counter Ring — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<div class="counter-ring counter-ring--large" style="--counter-ring-value: 100" role="img" aria-label="100%">
  <svg class="counter-ring__svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="counter-ring__track" cx="18" cy="18" r="15.5" pathLength="100"/><circle class="counter-ring__arc" cx="18" cy="18" r="15.5" pathLength="100"/></svg>
  <span class="counter-ring__text"><span class="counter-ring__number">1</span></span>
</div>

<div class="counter-ring counter-ring--large" style="--counter-ring-value: 80" role="img" aria-label="80%">
  <svg class="counter-ring__svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="counter-ring__track" cx="18" cy="18" r="15.5" pathLength="100"/><circle class="counter-ring__arc" cx="18" cy="18" r="15.5" pathLength="100"/></svg>
  <span class="counter-ring__text"><span class="counter-ring__number">7</span><span class="counter-ring__days">days</span></span>
</div>

<div class="counter-ring counter-ring--medium" style="--counter-ring-value: 50" role="img" aria-label="50%">
  <svg class="counter-ring__svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="counter-ring__track" cx="18" cy="18" r="15.5" pathLength="100"/><circle class="counter-ring__arc" cx="18" cy="18" r="15.5" pathLength="100"/></svg>
  <span class="counter-ring__text"><span class="counter-ring__number">3</span></span>
</div>

<div class="counter-ring counter-ring--small" style="--counter-ring-value: 20" role="img" aria-label="20%">
  <svg class="counter-ring__svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="counter-ring__track" cx="18" cy="18" r="15.5" pathLength="100"/><circle class="counter-ring__arc" cx="18" cy="18" r="15.5" pathLength="100"/></svg>
  <span class="counter-ring__text"><span class="counter-ring__number">1</span></span>
</div>
