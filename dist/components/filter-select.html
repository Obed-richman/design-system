<!-- Filter Select — Zego Design System
     Paste into a page that loads dist/zego-ds.css + dist/zego-ds.js. -->

<!-- Click the field to open; tick options to add them as chips (and back). -->
<div class="filter-select" data-open="true">
  <div class="filter-select__trigger" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="true">
    <span class="filter-select__value">
      <span class="filter-select__label">Status</span>
      <span class="filter-select__chips"></span>
    </span>
    <span class="filter-select__chevron"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11.2163 17.0716L1.61934 8.3144C1.41536 8.12826 1.40089 7.81201 1.58703 7.60803L2.26108 6.86934C2.44721 6.66536 2.76346 6.65089 2.96744 6.83703L11.9241 15.0099L20.8807 6.83702C21.0846 6.65089 21.4009 6.66536 21.587 6.86934L22.2611 7.60803C22.4472 7.81201 22.4327 8.12826 22.2288 8.3144L12.6318 17.0716C12.2309 17.4375 11.6172 17.4375 11.2163 17.0716Z" fill="currentColor"/></svg></span>
  </div>
  <div class="filter-select__dropdown" role="listbox">
      <label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="active" data-fs-label="Active" data-fs-variant="success" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--success">Active</span></label>
      <label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="pending" data-fs-label="Pending" data-fs-variant="warning" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--warning">Pending</span></label>
      <label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="failed" data-fs-label="Failed" data-fs-variant="error"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--error">Failed</span></label>
      <label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="inactive" data-fs-label="Inactive" data-fs-variant="inactive"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--inactive">Inactive</span></label>
  </div>
</div>
