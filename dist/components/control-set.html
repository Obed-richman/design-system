<div class="control-set">

    <span class="search__glyph"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.0867 1C5.06825 1 1 5.06825 1 10.0867C1 15.1051 5.06825 19.1734 10.0867 19.1734C12.2322 19.1734 14.204 18.4298 15.7585 17.1863L21.4243 22.8521C21.6214 23.0493 21.9411 23.0493 22.1382 22.8521L22.8521 22.1382C23.0493 21.9411 23.0493 21.6214 22.8521 21.4243L17.1863 15.7585C18.4298 14.204 19.1734 12.2322 19.1734 10.0867C19.1734 5.06825 15.1051 1 10.0867 1ZM3.01926 10.0867C3.01926 6.18346 6.18346 3.01926 10.0867 3.01926C13.9899 3.01926 17.1541 6.18346 17.1541 10.0867C17.1541 13.9899 13.9899 17.1541 10.0867 17.1541C6.18346 17.1541 3.01926 13.9899 3.01926 10.0867Z" fill="currentColor"/></svg></span>
  </div>
  <div class="control-set__date-wrap">
    <button class="input-field control-set__date" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="control-set__date-value" data-placeholder="Select dates">21 Jan 2026 &rarr; 30 Jan 2026</span>
      <span class="control-set__date-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 5C1 3.89543 1.89543 3 3 3H21C22.1046 3 23 3.89543 23 5V21C23 22.1046 22.1046 23 21 23H3C1.89543 23 1 22.1046 1 21V5ZM21 5L3 5V21H21V5Z" fill="currentColor"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M21 10L2 10L2 8L21 8V10Z" fill="currentColor"/> <path d="M16 1.5C16 1.22386 16.2239 1 16.5 1H17.5C17.7761 1 18 1.22386 18 1.5V4.25C18 4.52614 17.7761 4.75 17.5 4.75H16.5C16.2239 4.75 16 4.52614 16 4.25V1.5Z" fill="currentColor"/> <path d="M6 1.5C6 1.22386 6.22386 1 6.5 1H7.5C7.77614 1 8 1.22386 8 1.5V4.25C8 4.52614 7.77614 4.75 7.5 4.75H6.5C6.22386 4.75 6 4.52614 6 4.25V1.5Z" fill="currentColor"/></svg></span>
    </button>
    <div class="control-set__datepicker">
      <div class="date-picker date-picker--compact" data-mode="range" data-year="2026" data-month="0" data-today="2026-0-15" data-range-start="2026-0-21" data-range-end="2026-0-30">
        <div class="date-picker__header">
          <button class="btn btn--secondary btn--fab date-picker__nav date-picker__prev" type="button" aria-label="Previous month"><span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.1018 20.4098C13.2972 20.6049 13.2972 20.9213 13.1018 21.1164L12.3641 21.8532C12.1687 22.0483 11.8519 22.0483 11.6565 21.8532L2.19214 12.4013C2.1798 12.389 2.16824 12.3762 2.15746 12.3629L2.14656 12.3521C1.95117 12.1569 1.95117 11.8406 2.14656 11.6454L11.6585 2.14614C11.8539 1.951 12.1706 1.951 12.366 2.14614L13.1037 2.88286C13.2991 3.078 13.2991 3.39437 13.1037 3.5895L5.68394 10.9995L21.5002 10.9995C21.7764 10.9995 22.0002 11.2233 22.0002 11.4995V12.4995C22.0002 12.7756 21.7764 12.9995 21.5002 12.9995L5.68167 12.9995L13.1018 20.4098Z" fill="currentColor"/></svg></span></button>
          <p class="date-picker__title">January 2026</p>
          <button class="btn btn--secondary btn--fab date-picker__nav date-picker__next" type="button" aria-label="Next month"><span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.8984 3.58972C10.703 3.39458 10.703 3.07821 10.8984 2.88308L11.6361 2.14635C11.8315 1.95122 12.1483 1.95122 12.3437 2.14635L21.8081 11.5982C21.8204 11.6105 21.832 11.6233 21.8428 11.6366L21.8537 11.6475C22.0491 11.8426 22.0491 12.159 21.8537 12.3541L12.3418 21.8534C12.1464 22.0485 11.8296 22.0485 11.6342 21.8534L10.8965 21.1166C10.7011 20.9215 10.7011 20.6051 10.8965 20.41L18.3163 13H2.5C2.22386 13 2 12.7762 2 12.5V11.5C2 11.2239 2.22386 11 2.5 11H18.3186L10.8984 3.58972Z" fill="currentColor"/></svg></span></button>
        </div>
        <div class="date-picker__weekdays"><span class="date-picker__weekday">M</span><span class="date-picker__weekday">T</span><span class="date-picker__weekday">W</span><span class="date-picker__weekday">T</span><span class="date-picker__weekday">F</span><span class="date-picker__weekday">S</span><span class="date-picker__weekday">S</span></div>
        <div class="date-picker__grid"></div>
        <div class="date-picker__actions">
          <button class="btn btn--secondary btn--rounded btn--medium date-picker__clear" type="button">Clear</button>
          <button class="btn btn--primary btn--rounded btn--medium date-picker__confirm" type="button">Confirm</button>
        </div>
      </div>
    </div>
  </div>
  <div class="filter-select control-set__filter" data-open="false"><div class="filter-select__trigger" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false"><span class="filter-select__value"><span class="filter-select__label">Status</span><span class="filter-select__chips"></span></span><span class="filter-select__chevron"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11.2163 17.0716L1.61934 8.3144C1.41536 8.12826 1.40089 7.81201 1.58703 7.60803L2.26108 6.86934C2.44721 6.66536 2.76346 6.65089 2.96744 6.83703L11.9241 15.0099L20.8807 6.83702C21.0846 6.65089 21.4009 6.66536 21.587 6.86934L22.2611 7.60803C22.4472 7.81201 22.4327 8.12826 22.2288 8.3144L12.6318 17.0716C12.2309 17.4375 11.6172 17.4375 11.2163 17.0716Z" fill="currentColor"/></svg></span></div><div class="filter-select__dropdown" role="listbox"><label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="active" data-fs-label="Active" data-fs-variant="success" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--success">Active</span></label><label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="pending" data-fs-label="Pending" data-fs-variant="warning" checked><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--warning">Pending</span></label><label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="failed" data-fs-label="Failed" data-fs-variant="error"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--error">Failed</span></label><label class="checkbox filter-select__option"><input class="checkbox__input" type="checkbox" value="inactive" data-fs-label="Inactive" data-fs-variant="inactive"><span class="checkbox__box"><svg class="checkbox__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l3.8 3.8L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="status-label status-label--rounded status-label--inactive">Inactive</span></label></div></div>
  <button class="btn btn--secondary btn--rounded control-set__clear" type="button">Clear all</button>
</div>
<div style="height:40px"></div>
<div class="control-set control-set--tabs">
  <div class="tabs" role="tablist" aria-label="Views"><button class="tab-item tab-item--active" role="tab" aria-selected="true">All</button><button class="tab-item" role="tab" aria-selected="false">Active</button><button class="tab-item" role="tab" aria-selected="false">Pending</button><button class="tab-item" role="tab" aria-selected="false">Archived</button></div>
</div>
