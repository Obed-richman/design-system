  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background-page);
      color: var(--text-primary);
      font-family: var(--font-family-base);
      min-height: 100vh;
    }

    /* ---- Header ---- */
    .header {
      width: 100%;
      height: 104px;
      background: var(--brand-3-high);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header__logo {
      display: inline-flex;
      align-items: center;
      color: var(--colour-white);
    }
    .header__logo svg {
      width: 110px;
      height: 32px;
      display: block;
    }

    /* ---- Content ---- */
    .content {
      max-width: 876px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    /* ---- Search bar (Design System Search component) ---- */
    .search-wrapper { margin-bottom: 24px; }

    /* ---- Cards list ---- */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- Component card ---- */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--colour-white);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    .card:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }
    /* Keyboard focus — matches the secondary button's focus state */
    .card:focus-visible {
      outline: none;
      border-color: var(--border-primary);
      box-shadow: var(--shadow-focus);
      transform: none;
    }

    /* Live component preview strip */
    .card__preview {
      min-height: 148px;
      padding: 24px;
      background: var(--surface-secondary);
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    /* Neutralise cursor/interaction inside previews — the whole card is the link */
    .card__preview * { cursor: pointer; }
    .card__preview .btn,
    .card__preview .input,
    .card__preview .checkbox,
    .card__preview .radio,
    .card__preview .toggle,
    .card__preview .text-icon-item,
    .card__preview .radio-list__row,
    .card__preview .tab-item,
    .card__preview .comparison-tile,
    .card__preview .accordion__header,
    .card__preview .dropdown-item,
    .card__preview .dropdown-list,
    .card__preview .sales-nav,
    .card__preview .veh-reg__field,
    .card__preview .detail-card,
    .card__preview .discount-code,
    .card__preview .discount-code__applied,
    .card__preview .date-picker,
    .card__preview .notice-toggle,
    .card__preview .top-nav,
    .card__preview .tier-card,
    .card__preview .tier-section,
    .card__preview .tp-reviews,
    .card__preview .extra-cover,
    .card__preview .addons,
    .card__preview .total-cost,
    .card__preview .product-card,
    .card__preview .bullet-points,
    .card__preview .footer-sales,
    .card__preview .driving-licence,
    .card__preview .marketing-banner,
    .card__preview .bottom-nav,
    .card__preview .mobile-nav,
    .card__preview .tooltip,
    .card__preview .segment { pointer-events: none; }

    .card__body {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
    }
    .card__text {
      flex: 1;
      min-width: 0;
    }

    /* Icons preview row */
    .icon-preview {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--icon-glyph-primary);
    }
    .icon-preview svg { width: 24px; height: 24px; display: block; }

    /* Alert card preview: use the 16px info icon so it sits better with the text */
    .card__preview .alert__icon,
    .card__preview .alert__icon svg { width: 16px; height: 16px; }
    .card__title {
      font-family: var(--font-family-base);
      font-weight: 700;
      font-size: 18px;
      line-height: 24px;
      color: var(--text-primary, #27252d);
      margin: 0;
    }
    .card__description {
      font-family: var(--font-family-base);
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-disabled);
      margin: 4px 0 0;
    }
    .card__arrow {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    /* ---- Empty state ---- */
    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--colour-grey-60);
      font-family: var(--font-family-base);
      font-size: var(--font-size-body-2);
      display: none;
    }
  </style>

    const cardsList  = document.getElementById('cards-list');
    const emptyState = document.getElementById('empty-state');
    const searchInput = document.getElementById('search');

    function renderCards(items) {
      cardsList.innerHTML = '';
      if (items.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';
      items.forEach(({ name, description, page, preview }) => {
        const card = document.createElement('a');
        card.href = page;
        card.className = 'card';

        card.innerHTML = `
          <div class="card__preview" aria-hidden="true">${preview || ''}</div>
          <div class="card__body">
            <div class="card__text">
              <h3 class="card__title">${name}</h3>
              <p class="card__description">${description}</p>
            </div>
            <div class="card__arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        `;
        cardsList.appendChild(card);
      });
    }

    function filterCards(query) {
      const q = query.trim().toLowerCase();
      if (!q) { renderCards(components); return; }
      renderCards(components.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.description.toLowerCase().includes(q)
      ));
    }

    searchInput.addEventListener('input', e => filterCards(e.target.value));

    renderCards(components);
  </script>
