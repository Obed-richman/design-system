<!DOCTYPE html>
<html lang="en" data-theme="light" data-sc-viewport>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy length — Sales journey</title>

  <!-- Design system kit: tokens + typography + every component's CSS + fonts -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="journey.css">

  <!-- Floating Light/Dark + Desktop/Mobile toggle (dev-only; remove before sharing) -->
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>

  <!-- Interactive component behaviour (self-initialising) -->
  <script src="../../components/sales-nav/sales-nav.js" defer></script>

  <!-- Screen-level messages: the Global Alert stack + Alert's own close behaviour -->
  <script src="../../components/alert/alert.js" defer></script>
  <script src="../../components/global-alert/global-alert.js" defer></script>

  <!-- Injects the Sales Navigation (stepper set from the flow) + Sales Footer -->
  <script src="journey.js" defer></script>
</head>
<body>

  <!-- Figma: Sales Journey — Ideation / Policy length
       mobile  https://www.figma.com/design/ctOEKl0RfNNVoXyB998G0V/Sales-Journey---Ideation?node-id=7811-103924
       desktop https://www.figma.com/design/ctOEKl0RfNNVoXyB998G0V/Sales-Journey---Ideation?node-id=8072-455282
       Second page of the Quote step — see the STEPS list in journey.js -->
  <main class="proto" data-step="quote">

    <div class="proto__intro">
      <h1 class="proto__title">Fixed term or flexible?</h1>
      <p class="proto__lead">Choose your policy length. A full year, or month to month.</p>
    </div>

    <!-- Two Product Cards as one question. The whole card is the label, so the
         answer is the card rather than the small radio in its corner — the radio
         reports the state, it isn't the target. 12 months ships selected, as the
         frames draw it. -->
    <fieldset class="proto__options" data-required-error="Choose a policy length.">
      <legend class="visually-hidden">Policy length</legend>
      <label class="product-card product-card--fluid">
        <div class="product-card__header">
          <div class="product-card__top">
            <span class="product-card__badge product-card__badge--brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"> <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 4C10.7761 4 11 4.22386 11 4.5V5H17V4.5C17 4.22386 17.2239 4 17.5 4H18.5C18.7761 4 19 4.22386 19 4.5V5H21.5C22.3284 5 23 5.67157 23 6.5V19C23 20.1046 22.1046 21 21 21H7C5.89543 21 5 20.1046 5 19V6.5C5 5.67157 5.67157 5 6.5 5H9V4.5C9 4.22386 9.22386 4 9.5 4H10.5ZM7 19H21V12H7V19ZM7 10H21V7H19V7.5C19 7.77614 18.7761 8 18.5 8H17.5C17.2239 8 17 7.77614 17 7.5V7H11V7.5C11 7.77614 10.7761 8 10.5 8H9.5C9.22386 8 9 7.77614 9 7.5V7H7V10Z" fill="currentColor"/> <path d="M13.5 1C13.7761 1 14 1.22386 14 1.5V2.5C14 2.77614 13.7761 3 13.5 3H3.5C3.22386 3 3 3.22386 3 3.5V14.5C3 14.7761 2.77614 15 2.5 15H1.5C1.22386 15 1 14.7761 1 14.5V3C1 1.89543 1.89543 1 3 1H13.5Z" fill="currentColor"/> </svg></span>
            <div class="product-card__meta">
              <input class="radio__input" type="radio" name="policy-length" value="12-months" checked>
              <span class="radio__control"></span>
            </div>
          </div>

          <p class="product-card__title">12 months</p>
          <p class="product-card__subtitle">Best value if you&#39;re driving year-round.</p>

          <ul class="product-card__benefits">
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">Pay monthly or annually</span>
            </li>
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">Cheaper than rolling 30-day cover</span>
            </li>
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">One year of cover, sorted</span>
            </li>
          </ul>
        </div>
      </label>
      <label class="product-card product-card--fluid">
        <div class="product-card__header">
          <div class="product-card__top">
            <span class="product-card__badge product-card__badge--brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"> <path fill-rule="evenodd" clip-rule="evenodd" d="M1 5C1 3.89543 1.89543 3 3 3H21C22.1046 3 23 3.89543 23 5V21C23 22.1046 22.1046 23 21 23H3C1.89543 23 1 22.1046 1 21V5ZM21 5L3 5V21H21V5Z" fill="currentColor"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M21 10L2 10L2 8L21 8V10Z" fill="currentColor"/> <path d="M16 1.5C16 1.22386 16.2239 1 16.5 1H17.5C17.7761 1 18 1.22386 18 1.5V4.25C18 4.52614 17.7761 4.75 17.5 4.75H16.5C16.2239 4.75 16 4.52614 16 4.25V1.5Z" fill="currentColor"/> <path d="M6 1.5C6 1.22386 6.22386 1 6.5 1H7.5C7.77614 1 8 1.22386 8 1.5V4.25C8 4.52614 7.77614 4.75 7.5 4.75H6.5C6.22386 4.75 6 4.52614 6 4.25V1.5Z" fill="currentColor"/> </svg></span>
            <div class="product-card__meta">
              <input class="radio__input" type="radio" name="policy-length" value="30-days">
              <span class="radio__control"></span>
            </div>
          </div>

          <p class="product-card__title">30 days</p>
          <p class="product-card__subtitle">Flexible cover when you need more freedom.</p>

          <ul class="product-card__benefits">
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">No long-term commitment</span>
            </li>
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">Great for changing circumstances</span>
            </li>
            <li class="product-card__benefit">
              <span class="product-card__benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.2891 5.25373C17.6283 4.91487 18.1785 4.91468 18.5176 5.25373L19.7451 6.48225C20.0843 6.82144 20.0843 7.37157 19.7451 7.71076L9.89552 17.5604C9.55638 17.8994 9.00713 17.8993 8.66798 17.5604L4.25392 13.1473C3.91492 12.8081 3.91491 12.2579 4.25392 11.9188L5.4629 10.7098C5.80204 10.3706 6.35221 10.3707 6.69142 10.7098L9.2627 13.2811L17.2891 5.25373Z" fill="currentColor"/></svg></span>
              <span class="product-card__benefit-text">A simple way to try Zego before you commit</span>
            </li>
          </ul>
        </div>
      </label>
    </fieldset>

    <div class="proto__cta">
      <button class="btn btn--primary btn--pill btn--block" type="button" data-journey="next">Continue</button>
      <p class="proto__cta-note">You can always change this later.</p>
    </div>

  </main>

</body>
</html>
