<!DOCTYPE html>
<html lang="en" data-theme="light" data-sc-viewport>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover start date — Sales journey</title>

  <!-- Design system kit: tokens + typography + every component's CSS + fonts -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="journey.css">

  <!-- Floating Light/Dark + Desktop/Mobile toggle (dev-only; remove before sharing) -->
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>

  <!-- Interactive component behaviour (self-initialising) -->
  <script src="../../components/sales-nav/sales-nav.js" defer></script>
  <script src="../../components/date-picker/date-picker.js" defer></script>

  <!-- Screen-level messages: the Global Alert stack + Alert's own close behaviour -->
  <script src="../../components/alert/alert.js" defer></script>
  <script src="../../components/global-alert/global-alert.js" defer></script>

  <!-- Injects the Sales Navigation (stepper set from the flow) + Sales Footer -->
  <script src="journey.js" defer></script>
</head>
<body>

  <!-- Figma: Sales Journey — Ideation / Policy start date
       mobile  https://www.figma.com/design/ctOEKl0RfNNVoXyB998G0V/Sales-Journey---Ideation?node-id=6260-94893
       desktop https://www.figma.com/design/ctOEKl0RfNNVoXyB998G0V/Sales-Journey---Ideation?node-id=8072-456093
       First page of the Quote step — see the STEPS list in journey.js -->
  <main class="proto" data-step="quote">

    <div class="proto__intro">
      <h1 class="proto__title">Ready to hit the road?</h1>
      <p class="proto__lead">Our cover fits your schedule, so tell us when you&#39;d like it to begin.</p>
    </div>

    <!-- Three ways to answer ONE question, so they answer for each other and fail
         together — see data-answer-group in journey.js. The dates on the two
         shortcuts are written by journey.js, because "today" is not a constant. -->
    <div class="proto__card proto__card--form" data-answer-group
         data-required-error="Select a cover start date.">

      <fieldset class="choice-selector choice-selector--vertical">
        <div class="choice-selector__options">
          <label class="text-icon-item text-icon-item--inactive">
            <span class="text-icon-item__text">
              <span class="text-icon-item__label">Today</span>
              <span class="text-icon-item__support" data-start-date="0">&nbsp;</span>
            </span>
            <input class="radio__input" type="radio" name="start" data-start-choice="0">
            <span class="radio__control"></span>
          </label>
          <label class="text-icon-item text-icon-item--inactive">
            <span class="text-icon-item__text">
              <span class="text-icon-item__label">Tomorrow</span>
              <span class="text-icon-item__support" data-start-date="1">&nbsp;</span>
            </span>
            <input class="radio__input" type="radio" name="start" data-start-choice="1">
            <span class="radio__control"></span>
          </label>
        </div>
      </fieldset>

      <div class="divider-text"><span class="divider-text__label">Or</span></div>

      <div class="input-group" data-start-picker>
        <label class="input-label input-label--title" for="start-date">Pick a date</label>
        <p class="input-support">Cover start date must be within 30 days.</p>
        <div class="input-field">
          <input class="input" id="start-date" type="text" readonly placeholder="Select"
                 autocomplete="off" aria-haspopup="dialog" aria-expanded="false">
          <span class="input__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"> <path fill-rule="evenodd" clip-rule="evenodd" d="M1 5C1 3.89543 1.89543 3 3 3H21C22.1046 3 23 3.89543 23 5V21C23 22.1046 22.1046 23 21 23H3C1.89543 23 1 22.1046 1 21V5ZM21 5L3 5V21H21V5Z" fill="currentColor"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M21 10L2 10L2 8L21 8V10Z" fill="currentColor"/> <path d="M16 1.5C16 1.22386 16.2239 1 16.5 1H17.5C17.7761 1 18 1.22386 18 1.5V4.25C18 4.52614 17.7761 4.75 17.5 4.75H16.5C16.2239 4.75 16 4.52614 16 4.25V1.5Z" fill="currentColor"/> <path d="M6 1.5C6 1.22386 6.22386 1 6.5 1H7.5C7.77614 1 8 1.22386 8 1.5V4.25C8 4.52614 7.77614 4.75 7.5 4.75H6.5C6.22386 4.75 6 4.52614 6 4.25V1.5Z" fill="currentColor"/> </svg></span>
        </div>

        <div class="date-picker proto__picker" hidden>
          <div class="date-picker__header">
            <button class="btn btn--secondary btn--fab date-picker__nav date-picker__prev" type="button" aria-label="Previous month">
              <span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.1018 20.4098C13.2972 20.6049 13.2972 20.9213 13.1018 21.1164L12.3641 21.8532C12.1687 22.0483 11.8519 22.0483 11.6565 21.8532L2.19214 12.4013C2.1798 12.389 2.16824 12.3762 2.15746 12.3629L2.14656 12.3521C1.95117 12.1569 1.95117 11.8406 2.14656 11.6454L11.6585 2.14614C11.8539 1.951 12.1706 1.951 12.366 2.14614L13.1037 2.88286C13.2991 3.078 13.2991 3.39437 13.1037 3.5895L5.68394 10.9995L21.5002 10.9995C21.7764 10.9995 22.0002 11.2233 22.0002 11.4995V12.4995C22.0002 12.7756 21.7764 12.9995 21.5002 12.9995L5.68167 12.9995L13.1018 20.4098Z" fill="currentColor"/></svg></span>
            </button>
            <p class="date-picker__title"></p>
            <button class="btn btn--secondary btn--fab date-picker__nav date-picker__next" type="button" aria-label="Next month">
              <span class="btn__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.8984 3.58972C10.703 3.39458 10.703 3.07821 10.8984 2.88308L11.6361 2.14635C11.8315 1.95122 12.1483 1.95122 12.3437 2.14635L21.8081 11.5982C21.8204 11.6105 21.832 11.6233 21.8428 11.6366L21.8537 11.6475C22.0491 11.8426 22.0491 12.159 21.8537 12.3541L12.3418 21.8534C12.1464 22.0485 11.8296 22.0485 11.6342 21.8534L10.8965 21.1166C10.7011 20.9215 10.7011 20.6051 10.8965 20.41L18.3163 13H2.5C2.22386 13 2 12.7762 2 12.5V11.5C2 11.2239 2.22386 11 2.5 11H18.3186L10.8984 3.58972Z" fill="currentColor"/></svg></span>
            </button>
          </div>

          <div class="date-picker__weekdays">
            <span class="date-picker__weekday">M</span>
            <span class="date-picker__weekday">T</span>
            <span class="date-picker__weekday">W</span>
            <span class="date-picker__weekday">T</span>
            <span class="date-picker__weekday">F</span>
            <span class="date-picker__weekday">S</span>
            <span class="date-picker__weekday">S</span>
          </div>

          <div class="date-picker__grid"><!-- filled by date-picker.js --></div>

          <div class="date-picker__actions">
            <button class="btn btn--secondary btn--pill" type="button" data-picker-cancel>Cancel</button>
            <button class="btn btn--primary btn--pill" type="button" data-picker-confirm>Confirm</button>
          </div>
        </div>
      </div>

    </div>

    <button class="btn btn--primary btn--pill btn--block" type="button" data-journey="next">Continue</button>

  </main>

</body>
</html>
