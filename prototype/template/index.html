<!DOCTYPE html>
<html lang="en" data-theme="light" data-sc-viewport>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype — Zego Design System</title>

  <!-- ============================================================
       Design system kit: tokens + typography + every component's CSS
       + fonts (loaded automatically). This is the only stylesheet you
       need — all component classes are available.
       ============================================================ -->
  <link rel="stylesheet" href="../kit.css">

  <!-- Floating Light/Dark + Desktop/Mobile toggle (data-sc-viewport on <html>
       enables the viewport toggle). Remove these two lines to drop the toolbar. -->
  <link rel="stylesheet" href="../../pages/showcase-controls.css">
  <script src="../../pages/showcase-controls.js" defer></script>

  <!-- Interactive component behaviour (self-initialising, safe to keep all) -->
  <script src="../../components/input/input.js" defer></script>
  <script src="../../components/alert/alert.js" defer></script>
  <script src="../../components/segment/segment.js" defer></script>
  <script src="../../components/tab-bar/tab-bar.js" defer></script>
  <script src="../../components/comparison-tile/comparison-tile.js" defer></script>
  <script src="../../components/date-picker/date-picker.js" defer></script>
  <script src="../../components/discount-code/discount-code.js" defer></script>
  <script src="../../components/detail-card/detail-card.js" defer></script>
  <script src="../../components/sales-nav/sales-nav.js" defer></script>

  <style>
    /* --- Prototype page scaffold (edit freely) --- */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background-page);
      color: var(--text-primary);
      font-family: var(--font-family-base);
    }

    /* Zego top bar — delete if your screen doesn't need it */
    .proto-header {
      height: 64px;
      background: var(--brand-3-high);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--colour-white);
    }
    .proto-header svg { width: 92px; height: 28px; display: block; }

    /* Screen canvas. The Desktop/Mobile toggle sets [data-viewport] on <html>;
       clear of the floating toolbar via the bottom padding. */
    .proto {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 24px 120px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    html[data-viewport="mobile"] .proto { max-width: 420px; }

    /* A page heading helper */
    .proto h1 { font-size: var(--font-size-title-4); font-weight: var(--font-weight-bold); margin: 0; }
    .proto p.lead { font-size: var(--font-size-body-2); color: var(--colour-grey-60); margin: 0; }
  </style>
</head>
<body>

  <!-- ============================================================
       HOW TO USE
       1. Duplicate this whole /prototype/template folder and rename it to
          your prototype (e.g. /prototype/renewal-flow). Keep it one level
          under /prototype so the ../ paths keep working.
       2. Build your screen inside <main class="proto"> below by pasting
          component markup. Grab markup from any component's showcase page
          in /components/<name>/<name>.html — every class is already loaded.
       3. Use the floating toolbar (bottom of the screen) to preview
          Light/Dark and Desktop/Mobile. It's dev-only — delete the two
          showcase-controls lines in <head> before sharing a final build.
       ============================================================ -->

    <h1>New prototype</h1>
