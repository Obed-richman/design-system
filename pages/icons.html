<!DOCTYPE html>
<html lang="en">
<head>

  <title>Icons — Design System</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../tokens/typography.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background-page);
      color: var(--text-primary);
      font-family: var(--font-family-base);
      min-height: 100vh;
    }

    /* ---- Header ---- */
    .header {
      width: 100%;
      height: 104px;
      background: var(--brand-3-high);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header__logo {
      display: inline-flex;
      align-items: center;
      color: var(--colour-white);
    }
    .header__logo svg {
      width: 110px;
      height: 32px;
      display: block;
    }

    /* ---- Content ---- */
    .content {
      max-width: 876px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    /* ---- Back button ---- */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 24px;
      border: 1px solid var(--border-primary);
      background: var(--colour-white);
      color: var(--text-primary);
      font-family: var(--font-family-base);
      font-size: var(--font-size-body-3);
      font-weight: var(--font-weight-regular);
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 24px;
      transition: background-color 200ms ease;
    }
    .back-btn:hover { background: var(--surface-secondary); }

    /* ---- Component title section ---- */
    .component-header { margin-bottom: 24px; }
    .component-header__name {
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-title-4);
      line-height: var(--line-height-title-4);
      color: var(--text-primary);
      margin: 0;
    }
    .component-header__description {
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-regular);
      font-size: var(--font-size-body-2);
      line-height: var(--line-height-body-2);
      color: var(--colour-grey-60);
      margin: 4px 0 0;
    }

    /* ---- Icon library container ---- */
    .variants {
      background: var(--colour-white);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      padding: 24px;
    }

    /* ---- Icon grid ---- */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .icon-section { margin-bottom: 32px; }
    .icon-section:last-child { margin-bottom: 0; }
    .icon-section__title {
      font-family: var(--font-family-base);
      font-size: var(--font-size-subtitle-3);
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-disabled);
      margin: 0 0 16px;
    }
    .icon-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 24px 16px;
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      background: var(--background-primary);
      transition: box-shadow 200ms ease;
    }
    .icon-tile:hover { box-shadow: var(--shadow-dropdown); }
    .icon-tile__glyph {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      color: var(--icon-glyph-primary);
    }
    .icon-tile__glyph img { display: block; width: 100%; height: 100%; }
    .icon-tile__glyph svg { width: auto; height: 24px; max-width: 28px; }
    .icon-tile__meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .icon-tile__name {
      font-family: var(--font-family-base);
      font-size: var(--font-size-body-3);
      font-weight: var(--font-weight-medium);
      color: var(--text-primary);
    }
    .icon-tile__cat {
      font-family: var(--font-family-base);
      font-size: var(--font-size-subtitle-4);
      color: var(--text-disabled);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
