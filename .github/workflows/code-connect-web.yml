name: Code Connect (Web)

# Publishes the HTML/Web Code Connect to Figma when a web mapping changes on main.
# Needs a repo secret FIGMA_ACCESS_TOKEN (scopes: File content: Read + Code Connect: Write).

on:
  push:
    branches: [main]
    paths:
      - 'components/**/*.figma.ts'
      - 'figma.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/code-connect-web.yml'
  workflow_dispatch: {}

concurrency:
  group: code-connect-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Publish Web Code Connect
        run: npm run figma:publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
